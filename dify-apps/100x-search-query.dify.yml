      - id: kb_writeback_format
        type: custom
        data:
          type: template-transform
          title: "格式化知识库写回文本块（可选增强）"
          variables:
            - variable: category
              value_selector: [phase1_gate, category_final]
            - variable: product_name
              value_selector: [phase1_gate, product_name_final]
            - variable: topic_angle
              value_selector: [phase1_gate, topic_angle_final]
            - variable: queries
              value_selector: [assemble_and_validate, queries_obj]
          template: |
            category: {{ category }}
            product_name: {{ product_name }}
            topic_angle: {{ topic_angle }}

            pinterest_patterns:
            {% for item in queries.pinterest %}- [{{ item.stage }}] {{ item.q }} :: {{ item.intent_cn }}
            {% endfor %}
            tiktok_patterns:
            {% for item in queries.tiktok %}- [{{ item.stage }}] {{ item.q }} :: {{ item.intent_cn }}
            {% endfor %}
            reddit_patterns:
            {% for item in queries.reddit %}- [{{ item.stage }}] {{ item.q }} :: {{ item.intent_cn }}
            {% endfor %}
          selected: false
        position: { x: 2560, y: 160 }
        positionAbsolute: { x: 2560, y: 160 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 260
        height: 80
      - id: kb_index
        type: custom
        data:
          type: knowledge-index
          title: "写回知识库：本品类的搜索词模式（可选增强）"
          dataset_id: "REPLACE_WITH_DATASET_ID"
          index_chunk_variable_selector: [kb_writeback_format, output]
          keyword_number: 10
          retrieval_model:
            top_k: 3
            score_threshold_enabled: false
            score_threshold: 0.5
          selected: false
        position: { x: 2860, y: 160 }
        positionAbsolute: { x: 2860, y: 160 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 100
      - id: success_end
        type: custom
        data:
          type: end
          title: "输出搜索词 bundle"
          outputs:
            - variable: bundle
              value_selector: [assemble_and_validate, bundle_json]
              value_type: string
            - variable: markdown_tables
              value_selector: [render_tables, output]
              value_type: string
            - variable: warnings
              value_selector: [assemble_and_validate, warnings_text]
              value_type: string
        position: { x: 3160, y: 160 }
        positionAbsolute: { x: 3160, y: 160 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 110
