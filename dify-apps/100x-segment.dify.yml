              value_type: object
            - variable: markdown_table
              value_selector: ["validate_bundle", "markdown_table"]
              value_type: string
            - variable: warnings
              value_selector: ["validate_bundle", "warnings"]
              value_type: array[string]
        position: { x: 3330, y: 220 }
