        width: 244
        height: 90
        data:
          title: "组装 scenes map + 生成 SCENE_ID"
          type: code
          code_language: python3
          code: |
            import json


            def main(items: list) -> dict:
                scenes = {}
                warnings = []
                idx = 0
                for raw in (items or []):
                    idx += 1
                    sid = f"SCENE_{idx}"
                    try:
                        parsed = json.loads(raw) if isinstance(raw, str) else (raw or {})
                    except Exception:
                        warnings.append(
                            f"{sid} 解析失败，Phase2 LLM 未返回合法 JSON，已跳过"
                            f"（原始内容前200字：{str(raw)[:200]}）"
                        )
                        continue
                    item = parsed.get("scene_item") if isinstance(parsed, dict) else None
                    if not isinstance(item, dict):
                        warnings.append(f"{sid} 缺少 scene_item 字段，已跳过")
                        continue
                    scenes[sid] = item
                return {"scenes": scenes, "scene_warnings": warnings}
          variables:
            - variable: items
              value_selector: [iteration_phase2_scenes, output]
          outputs:
            scenes:
              type: object
            scene_warnings:
              type: array[string]
          selected: false

      # ---------------------------------------------------------------
      # 6. Phase 2 pairings — 绑定 persona + scene + 脚本原句
      # ---------------------------------------------------------------
      - id: llm_build_pairings
        type: custom
        position: { x: 3940, y: 280 }
        positionAbsolute: { x: 3940, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 110
        data:
          title: "组装 pairings：绑定人物+场景+原句"
          type: llm
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.3
          prompt_template:
            - id: "a1b2c3d4-0005-4000-9000-000000000001"
              role: system
              text: |
                你是 100x-persona 技能 Phase 2 的 pairings 组装器（workflow.md Phase2"必做
                动作"第3步）。每条 pairing 把「一段脚本原句 script_span_quote」绑定到「一个
                persona_ref」+「一个 scene_ref」，并写 rationale（为什么这个人物+场景组合
                适合这段原句，一句话）。

                【硬性规则】
                1. script_span_quote 必须是脚本原文的逐字子串，不许改写、不许概括——下游会
                   用 `quote in source_script` 逐字校验。
                2. persona_ref / scene_ref 只能引用下面提供的 personas / scenes 里真实存在
                   的 key，不许杜撰不存在的 ID。
                3. 【对应公理4零孤儿】尽量让每一个 persona 和每一个 scene 都至少被一条
                   pairing 引用到——已经定义的人物/场景如果一条都没被用到，下游会判定为孤
                   儿并 FAIL。不要为了凑数量而编造脚本里没有依据的 pairing，也不要遗漏能够
                   合理配对的组合。
                4. segment_ref 是可选字段：如果下面提供的 segments_json 非空，为每条 pairing
                   尝试回填匹配的 segment_ref（引用 segments_json 里对应 segment 的 id）；如
                   果 segments_json 是空字符串，完全省略 segment_ref 字段，不要杜撰。

                可用的 personas（JSON）：
                {{#code_assemble_personas.personas#}}

                可用的 scenes（JSON）：
                {{#code_assemble_scenes.scenes#}}

                上游 100x-segment 产出的 segments（可能为空，为空则忽略 segment_ref）：
                {{#start.segments_json#}}

                严格只输出一个 JSON 数组，数组每一项形如：
                {
                  "pairing_id": "PAIR_...",
                  "script_span_quote": "...",
                  "persona_ref": "PERSONA_...",
                  "scene_ref": "SCENE_...",
                  "rationale": "..."
                }
                不要 markdown 代码块，不要解释文字。
            - id: "a1b2c3d4-0005-4000-9000-000000000002"
              role: user
              text: |
                完整脚本原文：
                {{#start.source_script#}}
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false
          selected: false

      - id: code_parse_pairings
        type: custom
        position: { x: 4240, y: 280 }
        positionAbsolute: { x: 4240, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "解析 pairings JSON 数组"
          type: code
          code_language: python3
          code: |
            import json
            import re


            def main(raw_text: str) -> dict:
                text = (raw_text or '').strip()
                text = re.sub(r'^```[a-zA-Z]*\s*', '', text)
                text = re.sub(r'```\s*$', '', text).strip()
                pairings = []
                try:
                    parsed = json.loads(text)
                    if isinstance(parsed, list):
                        pairings = [p for p in parsed if isinstance(p, dict)]
                except Exception:
                    pairings = []
                return {"pairings": pairings}
          variables:
            - variable: raw_text
              value_selector: [llm_build_pairings, text]
          outputs:
            pairings:
              type: array[object]
          selected: false

      # ---------------------------------------------------------------
      # 7. Phase 3 — 组装 PersonaSceneBundle
      # ---------------------------------------------------------------
      - id: code_assemble_bundle
        type: custom
        position: { x: 4520, y: 280 }
        positionAbsolute: { x: 4520, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "组装 PersonaSceneBundle"
          type: code
          code_language: python3
          code: |
            import json


            def main(
                source_script: str,
                personas: dict,
                persona_warnings: list,
                scenes: dict,
                scene_warnings: list,
                pairings: list,
            ) -> dict:
                warnings = list(persona_warnings or []) + list(scene_warnings or [])
                bundle = {
                    "source_script": source_script or "",
                    "personas": personas or {},
                    "scenes": scenes or {},
                    "pairings": pairings or [],
                    "meta": {
                        "generated_by": "100x-persona",
                        "warnings": warnings,
                    },
                }
                bundle_json = json.dumps(bundle, ensure_ascii=False, indent=2)
                personas_list = [dict(v, persona_id=k) for k, v in (personas or {}).items() if isinstance(v, dict)]
                scenes_list = [dict(v, scene_id=k) for k, v in (scenes or {}).items() if isinstance(v, dict)]
                return {
                    "bundle": bundle,
                    "bundle_json": bundle_json,
                    "personas_list": personas_list,
                    "scenes_list": scenes_list,
                }
          variables:
            - variable: source_script
              value_selector: [start, source_script]
            - variable: personas
              value_selector: [code_assemble_personas, personas]
            - variable: persona_warnings
              value_selector: [code_assemble_personas, persona_warnings]
            - variable: scenes
              value_selector: [code_assemble_scenes, scenes]
            - variable: scene_warnings
              value_selector: [code_assemble_scenes, scene_warnings]
            - variable: pairings
              value_selector: [code_parse_pairings, pairings]
          outputs:
            bundle:
              type: object
            bundle_json:
              type: string
            personas_list:
              type: array[object]
            scenes_list:
              type: array[object]
          selected: false

      # ---------------------------------------------------------------
      # 8. Phase 3 — 4条公理复核（ajv 的手写 stdlib 近似替代，见 notes.md）
      # ---------------------------------------------------------------
      - id: code_validate_bundle
        type: custom
        position: { x: 4800, y: 280 }
        positionAbsolute: { x: 4800, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 90
        data:
          title: "4条公理复核（referential/quote/vague-word/orphan/hedge）"
          type: code
          code_language: python3
          code: |
            import re

            RELATIONSHIP_ENUM = {
                "direct-to-camera", "confessional", "testimonial-witness",
                "voice-over", "duo-dialogue",
            }
            REQUIRED_PERSONA_FIELDS = [
                "identity_label", "authority_basis", "authority_evidence_quote",
                "audience_fit", "audience_pain_quote", "delivery_style",
                "relationship_to_camera",
            ]
            OPTIONAL_PERSONA_FIELDS = ["appearance_note"]
            ALLOWED_PERSONA_FIELDS = set(REQUIRED_PERSONA_FIELDS) | set(OPTIONAL_PERSONA_FIELDS)
            REQUIRED_SCENE_FIELDS = [
                "scene_name", "trigger_moment", "location", "micro_coordinate",
                "visual_props", "atmosphere",
            ]
            REQUIRED_PAIRING_FIELDS = [
                "pairing_id", "script_span_quote", "persona_ref", "scene_ref", "rationale",
            ]
            OPTIONAL_PAIRING_FIELDS = ["segment_ref"]
            ALLOWED_PAIRING_FIELDS = set(REQUIRED_PAIRING_FIELDS) | set(OPTIONAL_PAIRING_FIELDS)
            ALLOWED_TOP_FIELDS = {"source_script", "personas", "scenes", "pairings", "meta"}

            PERSONA_ID_RE = re.compile(r'^PERSONA_[A-Za-z0-9_]+$')
            SCENE_ID_RE = re.compile(r'^SCENE_[A-Za-z0-9_]+$')

            # 逐字搬自 schema.json 的负向前瞻正则（axioms.md 公理3）。刻意保持大小写敏感——
            # 源正则里 "TBD" 和 "tbd" 是分开列的两项，没有用不区分大小写标志，这里原样保留
            # 这个怪癖，不是"顺手改进"。
            VAGUE_WORDS = [
                "某处", "随便", "某个地方", "某场景", "某个场景", "某个地点", "某地", "某时",
                "待定", "TBD", "tbd", "somewhere", "Somewhere", "anywhere", "Anywhere",
            ]

            # 逐字搬自 scripts/validate.js 的 HEDGE_MARKERS（权威性对冲短语检测）。只扫
            # authority_evidence_quote，不扫 audience_pain_quote/script_span_quote——那两个
            # 字段里出现否定词往往是合法内容（如 "I can't sleep"）。
            HEDGE_MARKERS = [
                "if you don't believe me", "you don't have to believe me",
                "don't take my word for it", "i'm not sure", "i am not sure",
                "i don't know if", "maybe i'm wrong", "i could be wrong", "who knows",
                "not 100% sure", "i doubt",
                "如果你不信我", "你可以不信", "不管你信不信", "信不信由你", "我不确定",
                "我也不知道", "也许我", "谁知道呢", "说实话我也没底",
            ]
            DISCLOSURE_RE = re.compile(r'hedge|自我怀疑|信任反转|待核', re.IGNORECASE)


            def _err(errors, tag, msg):
                errors.append(f"[{tag}] {msg}")


            def main(bundle: dict) -> dict:
                errors = []
                if not isinstance(bundle, dict):
                    return {"errors": ["[schema-approx] bundle is not a JSON object"]}

                extra_top = [k for k in bundle.keys() if k not in ALLOWED_TOP_FIELDS]
                if extra_top:
                    _err(errors, "schema-approx",
                         f"root has unexpected fields (schema.json additionalProperties:false): {extra_top}")
                for req in ("source_script", "personas", "scenes", "pairings", "meta"):
                    if req not in bundle:
                        _err(errors, "schema-approx", f"root is missing required field '{req}'")

                source_script = bundle.get("source_script")
                if not isinstance(source_script, str) or not source_script:
                    _err(errors, "schema-approx", "source_script must be a non-empty string")
                    source_script = source_script if isinstance(source_script, str) else ""

                personas = bundle.get("personas")
                if not isinstance(personas, dict) or len(personas) == 0:
                    _err(errors, "schema-approx", "personas must be a non-empty object (minProperties:1)")
                    personas = personas if isinstance(personas, dict) else {}

                scenes = bundle.get("scenes")
                if not isinstance(scenes, dict) or len(scenes) == 0:
                    _err(errors, "schema-approx", "scenes must be a non-empty object (minProperties:1)")
                    scenes = scenes if isinstance(scenes, dict) else {}

                pairings = bundle.get("pairings")
                if not isinstance(pairings, list) or len(pairings) == 0:
                    _err(errors, "schema-approx", "pairings must be a non-empty array (minItems:1)")
                    pairings = pairings if isinstance(pairings, list) else []

                meta = bundle.get("meta")
                if not isinstance(meta, dict):
                    _err(errors, "schema-approx", "meta must be an object")
                    meta = {}
                if meta.get("generated_by") != "100x-persona":
                    _err(errors, "schema-approx", "meta.generated_by must be the constant '100x-persona'")
                warnings = meta.get("warnings")
                if not isinstance(warnings, list) or not all(isinstance(w, str) for w in warnings):
                    _err(errors, "schema-approx", "meta.warnings must be an array of strings")
                    warnings = [w for w in (warnings or []) if isinstance(w, str)]

                for pid, item in personas.items():
                    if not PERSONA_ID_RE.match(pid):
                        _err(errors, "schema-approx", f"personas key '{pid}' does not match ^PERSONA_[A-Za-z0-9_]+$")
                    if not isinstance(item, dict):
                        _err(errors, "schema-approx", f"personas.{pid} must be an object")
                        continue
                    extra = [k for k in item.keys() if k not in ALLOWED_PERSONA_FIELDS]
                    if extra:
                        _err(errors, "schema-approx",
                             f"personas.{pid} has unexpected fields (additionalProperties:false): {extra}")
                    for field in REQUIRED_PERSONA_FIELDS:
                        value = item.get(field)
                        if not isinstance(value, str) or not value.strip():
                            _err(errors, "schema-approx",
                                 f"personas.{pid}.{field} is missing or not a non-empty string")
                    rel = item.get("relationship_to_camera")
                    if rel is not None and rel not in RELATIONSHIP_ENUM:
                        _err(errors, "schema-approx",
                             f"personas.{pid}.relationship_to_camera '{rel}' is not one of {sorted(RELATIONSHIP_ENUM)}")

                for sid, item in scenes.items():
                    if not SCENE_ID_RE.match(sid):
                        _err(errors, "schema-approx", f"scenes key '{sid}' does not match ^SCENE_[A-Za-z0-9_]+$")
                    if not isinstance(item, dict):
                        _err(errors, "schema-approx", f"scenes.{sid} must be an object")
                        continue
                    extra = [k for k in item.keys() if k not in REQUIRED_SCENE_FIELDS]
                    if extra:
                        _err(errors, "schema-approx",
                             f"scenes.{sid} has unexpected fields (additionalProperties:false): {extra}")
                    for field in ("trigger_moment", "location", "micro_coordinate"):
                        value = item.get(field)
                        if not isinstance(value, str) or len(value) < 3:
                            _err(errors, "axiom3", f"scenes.{sid}.{field} missing or shorter than minLength:3")
                            continue
                        hit = next((w for w in VAGUE_WORDS if w in value), None)
                        if hit:
                            _err(errors, "axiom3",
                                 f"scenes.{sid}.{field} contains a closed-list vague placeholder word "
                                 f"'{hit}': \"{value}\"")
                    props = item.get("visual_props")
                    if (not isinstance(props, list) or len(props) < 2
                            or not all(isinstance(p, str) and p.strip() for p in props)):
                        _err(errors, "axiom3",
                             f"scenes.{sid}.visual_props must be an array of >=2 non-empty strings (minItems:2)")
                    atmosphere = item.get("atmosphere")
                    if not isinstance(atmosphere, str) or not atmosphere.strip():
                        _err(errors, "schema-approx", f"scenes.{sid}.atmosphere is missing or not a non-empty string")
                    scene_name = item.get("scene_name")
                    if not isinstance(scene_name, str) or not scene_name.strip():
                        _err(errors, "schema-approx", f"scenes.{sid}.scene_name is missing or not a non-empty string")

                for i, item in enumerate(pairings):
                    loc = f"pairings[{i}]"
                    if not isinstance(item, dict):
                        _err(errors, "schema-approx", f"{loc} must be an object")
                        continue
                    extra = [k for k in item.keys() if k not in ALLOWED_PAIRING_FIELDS]
                    if extra:
                        _err(errors, "schema-approx",
                             f"{loc} has unexpected fields (additionalProperties:false): {extra}")
                    for field in REQUIRED_PAIRING_FIELDS:
                        value = item.get(field)
                        if not isinstance(value, str) or not value.strip():
                            _err(errors, "schema-approx", f"{loc}.{field} is missing or not a non-empty string")
                    pref = item.get("persona_ref")
                    if isinstance(pref, str) and not PERSONA_ID_RE.match(pref):
                        _err(errors, "schema-approx", f"{loc}.persona_ref '{pref}' does not match ^PERSONA_[A-Za-z0-9_]+$")
                    sref = item.get("scene_ref")
                    if isinstance(sref, str) and not SCENE_ID_RE.match(sref):
                        _err(errors, "schema-approx", f"{loc}.scene_ref '{sref}' does not match ^SCENE_[A-Za-z0-9_]+$")

                persona_keys = set(personas.keys())
                scene_keys = set(scenes.keys())
                for i, item in enumerate(pairings):
                    if not isinstance(item, dict):
                        continue
                    loc = f"pairings[{i}]"
                    pref = item.get("persona_ref")
                    if isinstance(pref, str) and pref not in persona_keys:
                        _err(errors, "axiom1", f'{loc}.persona_ref "{pref}" does not exist as a key in personas')
                    sref = item.get("scene_ref")
                    if isinstance(sref, str) and sref not in scene_keys:
                        _err(errors, "axiom1", f'{loc}.scene_ref "{sref}" does not exist as a key in scenes')

                for pid, item in personas.items():
                    if not isinstance(item, dict):
                        continue
                    aeq = item.get("authority_evidence_quote")
                    if isinstance(aeq, str) and aeq not in source_script:
                        _err(errors, "axiom2",
                             f'personas.{pid}.authority_evidence_quote is not a literal substring of '
                             f'source_script -> "{aeq}"')
                    apq = item.get("audience_pain_quote")
                    if isinstance(apq, str) and apq not in source_script:
                        _err(errors, "axiom2",
                             f'personas.{pid}.audience_pain_quote is not a literal substring of '
                             f'source_script -> "{apq}"')
                for i, item in enumerate(pairings):
                    if not isinstance(item, dict):
                        continue
                    ssq = item.get("script_span_quote")
                    if isinstance(ssq, str) and ssq not in source_script:
                        _err(errors, "axiom2",
                             f'pairings[{i}].script_span_quote is not a literal substring of '
                             f'source_script -> "{ssq}"')

                for pid, item in personas.items():
                    if not isinstance(item, dict):
                        continue
                    aeq = item.get("authority_evidence_quote")
                    if not isinstance(aeq, str):
                        continue
                    lowered = aeq.lower()
                    hit = next((m for m in HEDGE_MARKERS if m.lower() in lowered), None)
                    if not hit:
                        continue
                    disclosed = any(
                        isinstance(w, str) and pid in w and DISCLOSURE_RE.search(w) for w in warnings
                    )
                    if not disclosed:
                        _err(errors, "axiom2-heuristic",
                             f'personas.{pid}.authority_evidence_quote contains a closed-list hedge/self-doubt '
                             f'marker ("{hit}") with no matching meta.warnings disclosure. This heuristic cannot '
                             f'tell whether a reversal actually happened, only that this closed-list pattern is '
                             f"present (see axioms.md #2 已知天花板). Fix by re-selecting an anchor quote that "
                             f"isn't itself a hedge, or adding a meta.warnings entry mentioning '{pid}' and "
                             f"'hedge'/'自我怀疑' so a human reviews the semantic direction before this ships.")

                used_personas = set()
                used_scenes = set()
                for item in pairings:
                    if not isinstance(item, dict):
                        continue
                    if isinstance(item.get("persona_ref"), str):
                        used_personas.add(item["persona_ref"])
                    if isinstance(item.get("scene_ref"), str):
                        used_scenes.add(item["scene_ref"])
                for pid in personas.keys():
                    if pid not in used_personas:
                        _err(errors, "axiom4", f"personas.{pid} is defined but never referenced by any pairing (orphan)")
                for sid in scenes.keys():
                    if sid not in used_scenes:
                        _err(errors, "axiom4", f"scenes.{sid} is defined but never referenced by any pairing (orphan)")

                return {"errors": errors}
