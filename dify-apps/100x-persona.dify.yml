app:
  name: "100x-persona · 人物×场景生成器"
  description: "输入 TikTok/UGC 脚本原文，输出谁来讲（人物）+ 在哪讲（独立场景实体）+ 两者如何绑定脚本原句，逐字可回指原文；四条公理（引用完整性/证据子串/场景防泛化/零孤儿）+ v1.2 自我怀疑短语披露缓解，均由 code 节点复核。"
  icon: "🎭"
  icon_type: emoji
  icon_background: "#FDE7D9"
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: "0.7.0"
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.11@REPLACE_WITH_REAL_HASH_AFTER_IMPORT
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    viewport: { x: 0, y: 0, zoom: 0.12 }
    nodes:
      # ---------------------------------------------------------------
      # 0. START — class A required source_script + class C optional segments_json
      # ---------------------------------------------------------------
      - id: start
        type: custom
        position: { x: 40, y: 280 }
        positionAbsolute: { x: 40, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 116
        data:
          title: "开始"
          type: start
          variables:
            - label: "脚本原文 source_script（类别A必填，不接视频文件）"
              variable: source_script
              type: paragraph
              required: true
              max_length: 50000
            - label: "上游 100x-segment 产出的 segments（类别C可选，缺失静默跳过）"
              variable: segments_json
              type: paragraph
              required: false
              max_length: 20000

      # ---------------------------------------------------------------
      # 1. 早期 KB 检索 —— 减少重复发明，为 delivery_style/visual_props 提供先例
      # ---------------------------------------------------------------
      - id: kb_retrieve_similar
        type: custom
        position: { x: 320, y: 280 }
        positionAbsolute: { x: 320, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
        data:
          title: "检索相似历史人物/场景（占位 dataset_id，需人工重连）"
          type: knowledge-retrieval
          dataset_ids:
            - "REPLACE_WITH_DATASET_ID"
          query_variable_selector: [start, source_script]
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 4
            reranking_enable: false
            score_threshold_enabled: false
            score_threshold: 0
          metadata_filtering_mode: disabled
          selected: false

      # ---------------------------------------------------------------
      # 2. Phase 1a — 候选说话人扫描
      # ---------------------------------------------------------------
      - id: llm_identify_candidates
        type: custom
        position: { x: 600, y: 280 }
        positionAbsolute: { x: 600, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 110
        data:
          title: "Phase1a 候选说话人扫描"
          type: llm
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: "a1b2c3d4-0001-4000-9000-000000000001"
              role: system
              text: |
                你是 100x-persona 技能 Phase 1 的候选说话人扫描器（对应 workflow.md Phase 1
                "接收后立即做" 第1步）。任务：通读用户提供的完整脚本原文，标出脚本里出现的
                候选"说话人"（谁在用第一人称/口播视角讲话）。

                规则：
                - 大多数单人口播脚本只有 1 个候选说话人；只有"第三方见证混剪型"这类脚本才会
                  出现 >=2 个。
                - 每个候选说话人输出一条简短线索（<=40字，中文或英文均可），描述这个说话人在
                  原文中的身份/位置线索，方便后续步骤定位到对应的原文句子。例如：
                  "以'I've been a night-shift ICU nurse for eleven years'开头自述的说话人"
                  或 "Person B: 提到住小户型公寓的说话人"。
                - 如果整份脚本完全没有第一人称口播视角（比如纯参数罗列，没有任何"我"/"I"类
                  自述句），返回空数组 []，不要编造一个不存在的说话人——这是 workflow.md
                  Phase1 失败处理明确要求的："连一句可用的语气强句都找不到"时不代猜。
                - 只输出一个 JSON 数组（字符串元素），不要输出 markdown 代码块，不要输出任何
                  解释文字。
            - id: "a1b2c3d4-0001-4000-9000-000000000002"
              role: user
              text: |
                脚本原文：
                {{#start.source_script#}}
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false
          selected: false

      - id: code_parse_candidates
        type: custom
        position: { x: 900, y: 280 }
        positionAbsolute: { x: 900, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "解析候选说话人 JSON 数组"
          type: code
          code_language: python3
          code: |
            import json
            import re


            def main(raw_text: str) -> dict:
                text = (raw_text or '').strip()
                # 部分模型仍会包一层 markdown 代码块，尽管提示里已要求不要这样做
                text = re.sub(r'^```[a-zA-Z]*\s*', '', text)
                text = re.sub(r'```\s*$', '', text).strip()
                candidates = []
                try:
                    parsed = json.loads(text)
                    if isinstance(parsed, list):
                        candidates = [str(item).strip() for item in parsed if str(item).strip()]
                except Exception:
                    candidates = []
                return {"candidates": candidates, "candidate_count": len(candidates)}
          variables:
            - variable: raw_text
              value_selector: [llm_identify_candidates, text]
          outputs:
            candidates:
              type: array[string]
            candidate_count:
              type: number
          selected: false

      - id: if_has_candidates
        type: custom
        position: { x: 1180, y: 280 }
        positionAbsolute: { x: 1180, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 126
        data:
          title: "是否存在候选说话人"
          type: if-else
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - id: "cond-candidates-0001"
                  variable_selector: [code_parse_candidates, candidate_count]
                  comparison_operator: ">"
                  value: "0"
                  varType: number
          selected: false

      - id: tpl_no_persona_signal
        type: custom
        position: { x: 1460, y: 560 }
        positionAbsolute: { x: 1460, y: 560 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 60
        data:
          title: "拼装：无人物信号失败文案"
          type: template-transform
          variables: []
          template: |
            这份脚本没有第一人称口播视角，不适合做人物设定，需要先补一版有说话人视角的脚本。
            （workflow.md Phase1 失败处理：通读后连一句可用的语气强句都找不到——不代猜、不代笔改写脚本本身。）
          selected: false

      - id: end_no_persona_signal
        type: custom
        position: { x: 1760, y: 560 }
        positionAbsolute: { x: 1760, y: 560 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "结束：无人物信号"
          type: end
          outputs:
            - variable: message
              value_selector: [tpl_no_persona_signal, output]
              value_type: string

      # ---------------------------------------------------------------
      # 3. Phase 1b — 逐候选人反推 Authority/Pain 证据（iteration）
      # ---------------------------------------------------------------
      - id: iteration_phase1_personas
        type: custom
        position: { x: 1460, y: 180 }
        positionAbsolute: { x: 1460, y: 180 }
        sourcePosition: right
        targetPosition: left
        width: 460
        height: 210
        zIndex: 1
        data:
          title: "Phase1b 逐人物反推 Authority/Pain"
          type: iteration
          iterator_selector: [code_parse_candidates, candidates]
          iterator_input_type: array[string]
          output_selector: [llm_extract_persona, text]
          output_type: array[string]
          is_parallel: false
          parallel_nums: 10
          error_handle_mode: terminated
          start_node_id: iteration_phase1_start

      - id: iteration_phase1_start
        parentId: iteration_phase1_personas
        type: custom-iteration-start
        draggable: false
        selectable: false
        position: { x: 24, y: 76 }
        positionAbsolute: { x: 1484, y: 256 }
        sourcePosition: right
        targetPosition: left
        width: 44
        height: 48
        zIndex: 1002
        data:
          title: ""
          type: iteration-start
          isInIteration: true

      - id: llm_extract_persona
        parentId: iteration_phase1_personas
        type: custom
        position: { x: 140, y: 60 }
        positionAbsolute: { x: 1600, y: 240 }
        sourcePosition: right
        targetPosition: left
        width: 280
        height: 120
        zIndex: 1002
        data:
          title: "单人物 Authority+Pain 抽取"
          type: llm
          isInIteration: true
          isInLoop: false
          iteration_id: iteration_phase1_personas
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: "a1b2c3d4-0002-4000-9000-000000000001"
              role: system
              text: |
                你是 100x-persona 技能 Phase 1 的单人物证据抽取器（workflow.md Phase1 步骤2-5，
                判据见 axioms.md 公理2）。你正在处理下面这一个候选说话人线索，只产出这一个人物。

                本轮候选说话人线索：{{#iteration_phase1_personas.item#}}

                如果检索到的历史先例 context 中有相似人物，可参考其 delivery_style/
                relationship_to_camera 的措辞习惯（不是抄用其人物本身），context 为空时忽略：
                {{#context#}}

                必须按下面规则抽取（原文见用户消息里的完整脚本）：

                1. Authority 信号（对应口播文案蓝图模块2）：扫描这个说话人的自我身份/经历宣称句
                   （"I've been a ... for N years" / "As a ..." / "I'm a ..." 这类第一人称
                   身份或经历宣称，资质型或经历型均可——真实 UGC 脚本经常没有正式资质，"产后
                   亲身经历"这类同理型信任同样合法，见 axioms.md 公理2"关于'权威'不要求正式
                   资质"）。
                2. Pain 信号（对应口播文案蓝图模块3）：扫描这个说话人的人群点名句（"If you're
                   a ..." / "For anyone who ..." / 具体痛点描述句）。
                3. 【硬性红线】authority_evidence_quote 和 audience_pain_quote 必须是脚本原文
                   里逐字出现的一段话——大小写不区分子串匹配，但不许改写、不许概括、不许翻译、
                   不许替换同义词。下游会用 `quote in source_script` 做逐字校验，任何复述都会
                   FAIL。
                4. authority_basis / audience_fit 是对上面两条引文的一句话中文总结（总结本身
                   可以意译，但引文字段不行）。
                5. delivery_style：一句话概括语气/人称/口语程度。
                6. relationship_to_camera：只能是这 5 个闭集枚举值之一：direct-to-camera /
                   confessional / testimonial-witness / voice-over / duo-dialogue。
                7. appearance_note：可选，一句话着装/视觉描述，不是生成提示词。
                8. 【降级路径，仅当这个说话人完全没有身份宣称句/人群点名句时启用】改用这个说
                   话人语气最强的一句话作为替代锚点（仍必须是原文逐字子串，不是留空、不是编
                   一句原文没有的话），并把 degraded 设为 true，degrade_reason 写清楚原因。
                9. 【自我怀疑短语自检，v1.2 缓解机制】检查你选的 authority_evidence_quote 是
                   否命中下面这个闭集短语表（不区分大小写子串匹配）：
                   英文：if you don't believe me / you don't have to believe me / don't take
                   my word for it / i'm not sure / i am not sure / i don't know if / maybe
                   i'm wrong / i could be wrong / who knows / not 100% sure / i doubt
                   中文：如果你不信我 / 你可以不信 / 不管你信不信 / 信不信由你 / 我不确定 /
                   我也不知道 / 也许我 / 谁知道呢 / 说实话我也没底
                   命中则 hedge_self_flagged 设为 true，hedge_note 写清楚命中了哪个短语、为
                   什么仍选它（如果有更好的候选锚点句，优先换一句，避免命中）。

                严格只输出下面这个 JSON 对象，不要 markdown 代码块，不要解释文字：
                {
                  "persona_item": {
                    "identity_label": "...",
                    "authority_basis": "...",
                    "authority_evidence_quote": "...",
                    "audience_fit": "...",
                    "audience_pain_quote": "...",
                    "delivery_style": "...",
                    "relationship_to_camera": "...",
                    "appearance_note": "..."
                  },
                  "degraded": false,
                  "degrade_reason": null,
                  "hedge_self_flagged": false,
                  "hedge_note": null
                }
            - id: "a1b2c3d4-0002-4000-9000-000000000002"
              role: user
              text: |
                完整脚本原文（逐字核对用，所有引文必须能在这段原文里逐字找到）：
                {{#start.source_script#}}
          context:
            enabled: true
            variable_selector: [kb_retrieve_similar, result]
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false
          selected: false

      - id: code_assemble_personas
        type: custom
        position: { x: 1980, y: 280 }
        positionAbsolute: { x: 1980, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "组装 personas map + 生成 PERSONA_ID"
          type: code
          code_language: python3
          code: |
            import json


            def main(items: list) -> dict:
                personas = {}
                warnings = []
                idx = 0
                for raw in (items or []):
                    idx += 1
                    pid = f"PERSONA_{idx}"
                    try:
                        parsed = json.loads(raw) if isinstance(raw, str) else (raw or {})
                    except Exception:
                        warnings.append(
                            f"{pid} 解析失败，Phase1 LLM 未返回合法 JSON，已跳过"
                            f"（原始内容前200字：{str(raw)[:200]}）"
                        )
                        continue
                    item = parsed.get("persona_item") if isinstance(parsed, dict) else None
                    if not isinstance(item, dict):
                        warnings.append(f"{pid} 缺少 persona_item 字段，已跳过")
                        continue
                    personas[pid] = item
                    if parsed.get("degraded"):
                        reason = parsed.get("degrade_reason") or "未说明具体原因"
                        warnings.append(
                            f"{pid} 权威/人群证据信号弱，已用替代锚点句，建议人工复核（{reason}）"
                        )
                    if parsed.get("hedge_self_flagged"):
                        note = parsed.get("hedge_note") or "命中闭集自我怀疑短语"
                        warnings.append(
                            f"{pid} authority_evidence_quote 含疑似自我怀疑(hedge)表述，"
                            f"建议人工复核语义方向（{note}）"
                        )
                return {"personas": personas, "persona_warnings": warnings}
          variables:
            - variable: items
              value_selector: [iteration_phase1_personas, output]
          outputs:
            personas:
              type: object
            persona_warnings:
              type: array[string]
          selected: false

      # ---------------------------------------------------------------
      # 4. Phase 2a — 场景线索簇扫描
      # ---------------------------------------------------------------
      - id: llm_identify_scene_clusters
        type: custom
        position: { x: 2260, y: 280 }
        positionAbsolute: { x: 2260, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 110
        data:
          title: "Phase2a 场景线索簇扫描"
          type: llm
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: "a1b2c3d4-0003-4000-9000-000000000001"
              role: system
              text: |
                你是 100x-persona 技能 Phase 2 的场景线索扫描器（workflow.md Phase2"必做动作"
                第1-2步）。通读脚本，标出脚本里出现的每一个不同的"场景线索簇"：地点词
                （bathroom / bedroom / break room / gym 等）、动作词暗示的位置（"toss a few
                in my bag"暗示携带场景、"couch"暗示休息室）、时间/节点词（"before bed" /
                "right after I get home" / "between shifts"）。

                【关键规则，对应公理1"场景是独立实体"】同一个人物在脚本里出现在2个不同地点，
                要拆成2个场景线索簇，不能因为是同一个人物就合并成1个——场景是独立实体，不是
                人物的附属描述。阶梯时间线型脚本（如 Day1 -> Day14）的不同时间阶段，即使地点
                相近，只要触发时刻不同，也应拆成独立场景线索簇。

                每个场景线索簇输出一条简短线索（<=40字），描述这个场景在原文中的位置/触发词，
                方便后续步骤定位到对应的原文句子。

                如果脚本是纯棚拍无场景暗示的口播（比如对着白墙念参数，没有任何地点/动作/时间
                线索），返回空数组 []，不要编造脚本里不存在的场景——这是 workflow.md Phase2
                失败处理明确要求的。

                只输出一个 JSON 数组（字符串元素），不要输出 markdown 代码块，不要输出任何解
                释文字。
            - id: "a1b2c3d4-0003-4000-9000-000000000002"
              role: user
              text: |
                脚本原文：
                {{#start.source_script#}}
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false
          selected: false

      - id: code_parse_scene_clusters
        type: custom
        position: { x: 2560, y: 280 }
        positionAbsolute: { x: 2560, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "解析场景线索簇 JSON 数组"
          type: code
          code_language: python3
          code: |
            import json
            import re


            def main(raw_text: str) -> dict:
                text = (raw_text or '').strip()
                text = re.sub(r'^```[a-zA-Z]*\s*', '', text)
                text = re.sub(r'```\s*$', '', text).strip()
                hints = []
                try:
                    parsed = json.loads(text)
                    if isinstance(parsed, list):
                        hints = [str(item).strip() for item in parsed if str(item).strip()]
                except Exception:
                    hints = []
                return {"scene_hints": hints, "scene_count": len(hints)}
          variables:
            - variable: raw_text
              value_selector: [llm_identify_scene_clusters, text]
          outputs:
            scene_hints:
              type: array[string]
            scene_count:
              type: number
          selected: false

      - id: if_has_scenes
        type: custom
        position: { x: 2840, y: 280 }
        positionAbsolute: { x: 2840, y: 280 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 126
        data:
          title: "是否存在场景线索"
          type: if-else
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - id: "cond-scenes-0001"
                  variable_selector: [code_parse_scene_clusters, scene_count]
                  comparison_operator: ">"
                  value: "0"
                  varType: number
          selected: false

      - id: tpl_no_scene_signal
        type: custom
        position: { x: 3120, y: 560 }
        positionAbsolute: { x: 3120, y: 560 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 60
        data:
          title: "拼装：无场景信号失败文案"
          type: template-transform
          variables: []
          template: |
            这份脚本没有可辨识的场景线索，无法独立建场景实体，需要人工补充拍摄场景设定。
            （workflow.md Phase2 失败处理：不代笔编造脚本里不存在的场景细节。）
          selected: false

      - id: end_no_scene_signal
        type: custom
        position: { x: 3420, y: 560 }
        positionAbsolute: { x: 3420, y: 560 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "结束：无场景信号"
          type: end
          outputs:
            - variable: message
              value_selector: [tpl_no_scene_signal, output]
              value_type: string

      # ---------------------------------------------------------------
