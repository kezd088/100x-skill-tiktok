                某个地点、某地、某时、待定、TBD、tbd、somewhere、Somewhere、anywhere、
                Anywhere。命中任一词下游会直接 FAIL。

                严格只输出下面这个 JSON 对象，不要 markdown 代码块，不要解释文字：
                {
                  "scene_item": {
                    "scene_name": "...",
                    "trigger_moment": "...",
                    "location": "...",
                    "micro_coordinate": "...",
                    "visual_props": ["...", "..."],
                    "atmosphere": "..."
                  }
                }
            - id: "a1b2c3d4-0004-4000-9000-000000000002"
