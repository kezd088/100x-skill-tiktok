          {% endfor %}
          ## 反差点 contrast_beats
          {% for c in contrast_beats %}
          ### {{ c.beat_id }} · {{ c.label_cn }} （{{ c.contrast_type }}）
          - A 端：{{ c.anchor_quote_a }}
          - B 端：{{ c.anchor_quote_b }}

          理由：{{ c.rationale }}

          {% endfor %}
