          本次生成未通过 100x-exaggerate 的机器校验，以下是逐条具体原因（不是通用
          报错文案）：

          {% for e in errors %}
          - {{ e }}
          {% endfor %}

          常见修复方式：
          - [schema:*] 结构类问题：检查必填字段/闭集枚举/beat_id 格式是否符合
            schema.json
          - [axiom2] 锚点类问题：确认引文是脚本原文的逐字子串，不是概括或翻译
          - [axiom3] 强度超限：按 hat_level/market 决定的天花板降低 intensity，
            不要改 technique
          - [axiom4] 反差退化：为 anchor_quote_b（或 _a）换一处脚本里真正不同的表述
