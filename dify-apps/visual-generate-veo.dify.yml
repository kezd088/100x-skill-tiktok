app:
  name: "Veo 视频生成"
  description: "接收 100x-prompt-compose 输出的 Veo-ready prompt 与时长（category=视频, model=veo 时的 ComposedPromptBundle），调用 Dify 官方 Gemini Video 插件（Veo 3.1）实际生成视频，返回视频地址与执行状态。"
  icon: "🎬"
  icon_type: emoji
  icon_background: "#FBE8D3"
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: "0.7.0"
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/gemini_video:0.0.15@79506f51ced07347e29fcb068fd1540ddaf756cb4ac815a37224816e0507c476
      version: null
