version: "0.7.0"
kind: app
app:
  name: "100x-prompt-compose 提示词组装器"
  description: "选模板（或匹配需求描述）+ 填变量 -> 逐字渲染并按 Veo/Seedance/即创 包装的最终生成提示词（图片/视频/通用件）。"
  icon: "🧩"
  icon_type: emoji
  icon_background: "#E0F2FE"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@e2665624a156f52160927bceac9e169bd7e5ae6b936ae82575e14c90af390e6e
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        data:
          type: start
          title: "输入"
          variables:
            - label: "模板 ID（14 选 1，留空则用需求描述匹配）"
              variable: template_id
              type: select
              required: false
              options: ["IMG-01-product-lock", "IMG-02-persona-whitebg", "IMG-03-8grid", "IMG-04-cover-hook", "IMG-05-before-after", "VID-A-efficacy-stack", "VID-B-dual-track", "VID-C-before-after", "VID-D-talking-share", "VID-E-role-pov", "VID-F-dark-humor", "VID-G-immersive-job", "PART-HOOK", "PART-CTA"]
            - label: "需求描述（template_id 留空时用于匹配模板，如“清洁喷雾的一喷见效效果”）"
              variable: requirement_description
              type: paragraph
              required: false
              max_length: 2000
            - label: "变量填值（JSON 对象字符串，键为该模板 variables[].key，不代猜不编造）"
              variable: variables_used_json
              type: paragraph
              required: true
              max_length: 5000
            - label: "视频模型（仅视频模板需要；留空则取该模板 model_hint 的第一个）"
              variable: model
              type: select
              required: false
              options: ["veo", "seedance", "即创"]
            - label: "已建立的参考编号（JSON，如 {\"产品\":[1],\"人物\":[]}；留空视为全部首次出现）"
              variable: existing_refs_input_json
              type: paragraph
              required: false
              max_length: 1000
        position: {x: 40, y: 380}
        positionAbsolute: {x: 40, y: 380}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 220
      - id: has_tid
        type: custom
        data:
          type: if-else
          title: "是否给了 template_id"
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - id: cond-has-tid
                  variable_selector: [start, template_id]
                  comparison_operator: "not empty"
                  value: ""
                  varType: string
        position: {x: 360, y: 380}
        positionAbsolute: {x: 360, y: 380}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 100
      - id: validate_tid
        type: custom
        data:
          type: code
          title: "校验 template_id（枚举，14 选 1）"
          code_language: python3
          code: |
            def main(template_id: str) -> dict:
                import json
                VALID = [
                    "IMG-01-product-lock", "IMG-02-persona-whitebg", "IMG-03-8grid",
                    "IMG-04-cover-hook", "IMG-05-before-after", "VID-A-efficacy-stack",
                    "VID-B-dual-track", "VID-C-before-after", "VID-D-talking-share",
                    "VID-E-role-pov", "VID-F-dark-humor", "VID-G-immersive-job",
                    "PART-HOOK", "PART-CTA",
                ]
                tid = (template_id or "").strip()
                if tid in VALID:
                    r = {"resolved_template_id": tid, "id_error": ""}
                else:
                    r = {"resolved_template_id": "", "id_error": "template_id '%s' 不是 templates.json 里的合法 id（14 选 1）" % tid}
                return {"template_resolution_json": json.dumps(r, ensure_ascii=False)}
          variables:
            - value_selector: [start, template_id]
              variable: template_id
          outputs:
            template_resolution_json:
              type: string
        position: {x: 680, y: 160}
        positionAbsolute: {x: 680, y: 160}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: classify_tid
        type: custom
        data:
          type: question-classifier
          title: "按需求描述匹配模板（14 选 1）"
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0
          query_variable_selector: [start, requirement_description]
          classes:
            - {id: "IMG-01-product-lock", name: "IMG-01-product-lock"}
            - {id: "IMG-02-persona-whitebg", name: "IMG-02-persona-whitebg"}
            - {id: "IMG-03-8grid", name: "IMG-03-8grid"}
            - {id: "IMG-04-cover-hook", name: "IMG-04-cover-hook"}
            - {id: "IMG-05-before-after", name: "IMG-05-before-after"}
            - {id: "VID-A-efficacy-stack", name: "VID-A-efficacy-stack"}
            - {id: "VID-B-dual-track", name: "VID-B-dual-track"}
            - {id: "VID-C-before-after", name: "VID-C-before-after"}
            - {id: "VID-D-talking-share", name: "VID-D-talking-share"}
            - {id: "VID-E-role-pov", name: "VID-E-role-pov"}
            - {id: "VID-F-dark-humor", name: "VID-F-dark-humor"}
            - {id: "VID-G-immersive-job", name: "VID-G-immersive-job"}
            - {id: "PART-HOOK", name: "PART-HOOK"}
            - {id: "PART-CTA", name: "PART-CTA"}
            - {id: "UNCLEAR", name: "UNCLEAR"}
          instruction: |
            把用户的需求描述匹配到最贴合的一个模板 id（唯一命中才选那一个；如果同时像好几个模板，或完全不像任何一个，选 UNCLEAR，不要猜）。14 个模板及其 use_when：
            IMG-01-product-lock：没有产品实拍图、需要先生成一张可复用的产品参考图。
            IMG-02-persona-whitebg：需要一个固定模特，后续所有视频/图片复用同一张脸。
            IMG-03-8grid：护肤/美白等渐变改善类，做“使用前→后”8宫格素材。
            IMG-04-cover-hook：需要一张抓眼的封面/首帧，放大问题。
            IMG-05-before-after：需要一张“问题→改善”的上下/左右对比图。
            VID-A-efficacy-stack：去污/清洁/美白/除锈等“一喷见效”类视频，同产品×不同污渍场景重复展示。
            VID-B-dual-track：害虫/蟑螂/鼠害等强功能、需要恐怖冲击的产品视频（口播+B-roll双轨）。
            VID-C-before-after：护肤/抗皱/美白等渐变效果类视频（一镜到底渐变消失）。
            VID-D-talking-share：护肤/宠物用品等需要“真人亲测推荐”口播分享视频。
            VID-E-role-pov：宠物/医疗等需要专业背书（兽医/美容师/专家视角）的视频。
            VID-F-dark-humor：清洁喷雾等可做悬疑反转黑色幽默剧情的视频。
            VID-G-immersive-job：清洁上门服务类第一人称沉浸工作流视频。
            PART-HOOK：给任意视频拼一个抓注意力的前3秒开头（拼接件，不是完整视频）。
            PART-CTA：给视频收尾加购买引导（拼接件，不是完整视频）。
          vision:
            enabled: false
        position: {x: 680, y: 480}
        positionAbsolute: {x: 680, y: 480}
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 160
      - id: map_classify
        type: custom
        data:
          type: code
          title: "分类结果映射为 template_id"
          code_language: python3
          code: |
            def main(class_name: str) -> dict:
                import json
                cid = (class_name or "").strip()
                if cid and cid != "UNCLEAR":
                    r = {"resolved_template_id": cid, "id_error": ""}
                else:
                    r = {
                        "resolved_template_id": "",
                        "id_error": "没识别出该用哪个模板：本 skill 目前有 14 个模板（5 图片/7 视频/2 通用件），可以直接报 id，或说清楚品类+想要的效果（比如清洁喷雾的一喷见效效果）",
                    }
                return {"template_resolution_json": json.dumps(r, ensure_ascii=False)}
          variables:
            - value_selector: [classify_tid, class_name]
              variable: class_name
          outputs:
            template_resolution_json:
              type: string
        position: {x: 1000, y: 480}
        positionAbsolute: {x: 1000, y: 480}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: merge_tid
        type: custom
        data:
          type: variable-aggregator
          title: "合并模板解析结果"
          output_type: string
          variables:
            - [validate_tid, template_resolution_json]
            - [map_classify, template_resolution_json]
        position: {x: 1320, y: 320}
        positionAbsolute: {x: 1320, y: 320}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
      - id: prep_ctx
        type: custom
        data:
          type: code
          title: "查模板元数据 + 校验必填变量 + 定模型"
          code_language: python3
          code: |
            def main(template_resolution_json: str, variables_used_json: str, existing_refs_input_json: str, model: str) -> dict:
                import json

                # key: (category, [(variable_key, is_optional), ...], model_hint, establishes_lock, references_lock)
                TEMPLATES_META = {
                    "IMG-01-product-lock": {"category": "图片", "vars": [("product_desc", False)], "model_hint": [], "establishes_lock": "产品", "references_lock": []},
                    "IMG-02-persona-whitebg": {"category": "图片", "vars": [("persona", False), ("problem", True)], "model_hint": [], "establishes_lock": "人物", "references_lock": []},
                    "IMG-03-8grid": {"category": "图片", "vars": [("persona_ref", False), ("problem", False), ("scenes", False)], "model_hint": [], "establishes_lock": "", "references_lock": ["人物"]},
                    "IMG-04-cover-hook": {"category": "图片", "vars": [("subject", False), ("problem", False), ("persona", True), ("scene", False)], "model_hint": [], "establishes_lock": "", "references_lock": []},
                    "IMG-05-before-after": {"category": "图片", "vars": [("layout", False), ("body_part", False), ("problem", False)], "model_hint": [], "establishes_lock": "", "references_lock": []},
                    "VID-A-efficacy-stack": {"category": "视频", "vars": [("persona", False), ("product_name", False), ("product_lock", False), ("target", False), ("effect_formula", False), ("scene", False)], "model_hint": ["veo", "seedance", "即创"], "establishes_lock": "", "references_lock": ["产品"]},
                    "VID-B-dual-track": {"category": "视频", "vars": [("persona", False), ("product_name", False), ("line_en", False), ("pest", False), ("place", False)], "model_hint": ["veo", "seedance"], "establishes_lock": "", "references_lock": []},
                    "VID-C-before-after": {"category": "视频", "vars": [("persona_ref", False), ("body_part", False), ("problem", False), ("serum_color", False)], "model_hint": ["veo", "seedance"], "establishes_lock": "", "references_lock": ["人物"]},
                    "VID-D-talking-share": {"category": "视频", "vars": [("persona", False), ("body_part", False), ("product_name", False), ("product_lock", False), ("line_open", False), ("line_rec", False)], "model_hint": ["veo", "seedance", "即创"], "establishes_lock": "", "references_lock": ["产品"]},
                    "VID-E-role-pov": {"category": "视频", "vars": [("role", False), ("role_outfit", False), ("breed", False), ("problem", False), ("product_name", False), ("line_en", False), ("scene", False)], "model_hint": ["veo", "seedance"], "establishes_lock": "", "references_lock": []},
                    "VID-F-dark-humor": {"category": "视频", "vars": [("suspect_action", False), ("product_name", False), ("stain", False)], "model_hint": ["veo", "seedance"], "establishes_lock": "", "references_lock": []},
                    "VID-G-immersive-job": {"category": "视频", "vars": [("rooms", False), ("target", False), ("product_name", False)], "model_hint": ["veo", "seedance"], "establishes_lock": "", "references_lock": []},
                    "PART-HOOK": {"category": "通用件", "vars": [("hook_type", False), ("subject", False), ("detail", False)], "model_hint": [], "establishes_lock": "", "references_lock": []},
                    "PART-CTA": {"category": "通用件", "vars": [("object", False), ("urgency", True)], "model_hint": [], "establishes_lock": "", "references_lock": []},
                }

                try:
                    res = json.loads(template_resolution_json or "{}")
                except Exception:
                    res = {}
                tid = res.get("resolved_template_id") or ""
                id_error = res.get("id_error") or ""

                try:
                    raw_vars = json.loads(variables_used_json or "{}")
                    if not isinstance(raw_vars, dict):
                        raw_vars = {}
                        if not id_error:
                            id_error = "variables_used_json 必须是 JSON 对象"
                except Exception:
                    raw_vars = {}
                    if not id_error:
                        id_error = "variables_used_json 不是合法 JSON"

                try:
                    existing = json.loads(existing_refs_input_json) if (existing_refs_input_json or "").strip() else {}
                    if not isinstance(existing, dict):
                        existing = {}
                except Exception:
                    existing = {}
                existing.setdefault("产品", [])
                existing.setdefault("人物", [])

                warnings = []
                prep_error = id_error
                category = ""
                model_hint = []
                establishes_lock = ""
                references_lock = []
                norm_vars = dict(raw_vars)

                if not prep_error:
                    meta = TEMPLATES_META.get(tid)
                    if not meta:
                        prep_error = "template_id %s 不是 templates.json 里的合法 id" % tid
                    else:
                        category = meta["category"]
                        model_hint = meta["model_hint"]
                        establishes_lock = meta["establishes_lock"]
                        references_lock = meta["references_lock"]
                        missing = []
                        for key, optional in meta["vars"]:
                            val = raw_vars.get(key)
                            if optional:
                                if val is None or val == "":
                                    norm_vars[key] = ""
                            else:
                                if val is None or (isinstance(val, str) and val.strip() == ""):
                                    missing.append(key)
                        if missing:
                            prep_error = "缺少必填变量（不代猜/不编造具体外观或台词内容）：%s" % ", ".join(missing)

                resolved_model = ""
                model_choice_source = ""
                if not prep_error and category == "视频":
                    given = (model or "").strip()
                    if given:
                        resolved_model = given
                        model_choice_source = "user_specified"
                    else:
                        resolved_model = model_hint[0] if model_hint else ""
                        model_choice_source = "default_first_hint"
                        warnings.append("model 未指定，默认使用 %s" % resolved_model)

                return {
                    "template_id": tid,
                    "category": category,
                    "prep_error": prep_error,
                    "variables_used_json": json.dumps(norm_vars, ensure_ascii=False),
                    "existing_refs_input_json": json.dumps(existing, ensure_ascii=False),
                    "resolved_model": resolved_model,
                    "model_choice_source": model_choice_source,
                    "warnings_json": json.dumps(warnings, ensure_ascii=False),
                    "establishes_lock": establishes_lock,
                    "references_lock_json": json.dumps(references_lock, ensure_ascii=False),
                }
          variables:
            - value_selector: [merge_tid, output]
              variable: template_resolution_json
            - value_selector: [start, variables_used_json]
              variable: variables_used_json
            - value_selector: [start, existing_refs_input_json]
              variable: existing_refs_input_json
            - value_selector: [start, model]
              variable: model
          outputs:
            template_id:
              type: string
            category:
              type: string
            prep_error:
              type: string
            variables_used_json:
              type: string
            existing_refs_input_json:
              type: string
            resolved_model:
              type: string
            model_choice_source:
              type: string
            warnings_json:
              type: string
            establishes_lock:
              type: string
            references_lock_json:
              type: string
        position: {x: 1640, y: 320}
        positionAbsolute: {x: 1640, y: 320}
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 120
      - id: input_ok
        type: custom
        data:
          type: if-else
          title: "输入是否齐全"
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - id: cond-input-ok
                  variable_selector: [prep_ctx, prep_error]
                  comparison_operator: empty
                  value: ""
                  varType: string
        position: {x: 1960, y: 320}
        positionAbsolute: {x: 1960, y: 320}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 100
      - id: reject_input
        type: custom
        data:
          type: end
          title: "拒绝：模板/必填变量缺失"
          outputs:
            - variable: error
              value_selector: [prep_ctx, prep_error]
              value_type: string
            - variable: template_id
              value_selector: [prep_ctx, template_id]
              value_type: string
        position: {x: 2280, y: 560}
        positionAbsolute: {x: 2280, y: 560}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
      - id: render_body
        type: custom
        data:
          type: code
          title: "逐字渲染 body + 方括号展开 + 引用锁记账（公理1构造+公理2构造）"
          code_language: python3
          code: |
            def main(template_id: str, category: str, variables_used_json: str, existing_refs_input_json: str, establishes_lock: str, references_lock_json: str) -> dict:
                import json
                import re

                REALISM_SUFFIX = {
                    "图片通用": "无美颜，无景深，无滤镜，无补光灯，真实皮肤纹理，真实环境。",
                    "视频自拍": "无补光灯，无美颜，人物面部没有高光，真实皮肤纹理和瑕疵。",
                    "加强防影棚": "无美颜，无景深，无滤镜，无补光灯，真实皮肤纹理，真实生活环境，轻微手持晃动，不要影棚感。",
                }

                TEMPLATES = {
                    "IMG-01-product-lock": {"suffix_key": "图片通用", "body": "生成一张产品白底图。产品外观为：{product_desc}。真实塑料/材质质感，标签印刷清晰，无反光眩光。{realism_suffix}"},
                    "IMG-02-persona-whitebg": {"suffix_key": "图片通用", "body": "手机后摄视角。生成一个{persona}的白底图片。人物表情平静（无笑容）。{problem_clause}{realism_suffix}"},
                    "IMG-03-8grid": {"suffix_key": "图片通用", "body": "生成{persona_ref}的8宫格图片。每张图人物的发型、发色不变，衣服款式会改变。8张图背景在{scenes}三个场景随机切换。{problem}从第1张初始状态到第8张完全消失。{realism_suffix}"},
                    "IMG-04-cover-hook": {"suffix_key": "图片通用", "body": "手机后摄视角，特写{subject}。{persona}双手掰开展示，让其呈现张大露出状态（{problem}）。背景是{scene}。{realism_suffix}"},
                    "IMG-05-before-after": {"suffix_key": "图片通用", "body": "生成一张{body_part}特写的{layout}对比图（不带任何文字）。{layout_desc}有{problem}，另一侧为{problem}消失、如年轻人一般。{realism_suffix}"},
                    "VID-A-efficacy-stack": {"suffix_key": "图片通用", "body": "手机后摄，固定机位。{persona}手持{product_name}（{product_lock}）对准{target}。【效果公式：{effect_formula}——按所选公式展开变化描写】。背景是可见的{scene}。{realism_suffix}", "effect_library": {"像素橡皮擦": "抹布缓慢沉重压过污渍，断裂式替换——抹布前是污渍色、抹布后是物品原色，色差为零。", "泡沫爆发": "喷洒瞬间浓稠白色活性泡沫爆发覆盖污渍并翻腾，随后百洁布擦去，显露洁净微湿无瑕表面。", "泡沫变色": "对准喷雾，白泡沫爆发包裹，几秒内由白变深黄，黄沫退去露出洁白锃亮。", "噼啪声": "泡沫严丝合缝包裹结石，变深黄并发出微小噼啪声，黄液滴落，露出如瓷洁白。", "玻璃板实验": "玻璃板左侧一滩污渍液体、右侧碎蛋壳，分别喷洒后左侧变无色、右侧冒泡化成透明水。"}},
                    "VID-B-dual-track": {"suffix_key": "视频自拍", "body": "【A-roll】iPhone前置自拍。{persona}，手持{product_name}，说话时头部自然转动伴手势。人物说：{line_en}\n【B-roll·恐怖】低画质夜视监控模式，{place}。高ISO噪点，压抑恐怖氛围。起初一片寂静，突然大量{pest}从缝隙中猛地窜出、四散奔逃。画面因恐惧剧烈手持晃动。{realism_suffix}"},
                    "VID-C-before-after": {"suffix_key": "视频自拍", "body": "手机前置摄像，固定机位。{persona_ref}展示一只手心里的{serum_color}，开始在{body_part}上轻轻涂抹有{problem}的区域。核心：药膏被吸收消失（渐变式），{problem}随之同帧100%渐变消退，露出光滑洁净皮肤。一镜到底，无分镜。人物不说话，仅做动作。{realism_suffix}"},
