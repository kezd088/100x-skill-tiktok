        data:
          type: code
          title: "公理4校验：seedance 时长/禁词（排除结尾固定句）/结尾固定句"
          code_language: python3
          code: |
            def main(wrapped_text: str) -> dict:
                import json
                import re

                BANNED = [
                    "cinematic", "professional", "studio", "beautiful", "stunning", "smooth skin",
                    "perfect", "flawless", "polished", "editorial", "glamour",
                    "text", "subtitle", "caption", "watermark", "logo", "title", "font", "letter", "word", "overlay",
                ]
                TRAILING = "no text, no subtitles, no watermarks"

                text = (wrapped_text or "").strip()
                errors = []

                if TRAILING not in text:
                    errors.append("[axiom4] final_prompt_wrapped(seedance) 缺少一字不差的结尾固定句: %s" % TRAILING)

                # 已知必要适配（见 profiles/seedance.md、axioms.md 公理4）：结尾固定句本身含
                # text/subtitle/watermark 3 个禁词，扫描前先排除这段固定句文本本身，
                # 再扫描剩余正文，避免"结尾硬规"和"零禁词"两条规则字面互相打架。
                scan_text = text.replace(TRAILING, "")

                def esc(w):
                    return re.escape(w)

                hits = [w for w in BANNED if re.search(r"\b%s\b" % esc(w), scan_text, re.IGNORECASE)]
                if hits:
                    errors.append("[axiom4] final_prompt_wrapped(seedance) 在结尾固定句之外命中禁词: %s" % ", ".join(hits))

                result = {
                    "model": "seedance",
                    "final_prompt_wrapped": text,
                    "duration_seconds": 10.0,
                    "narrative_shot_type": None,
                    "axiom4_pass": len(errors) == 0,
                    "axiom4_errors": errors,
                }
                return {"video_result_json": json.dumps(result, ensure_ascii=False)}
          variables:
            - value_selector: [wrap_seedance, text]
              variable: wrapped_text
          outputs:
            video_result_json:
              type: string
