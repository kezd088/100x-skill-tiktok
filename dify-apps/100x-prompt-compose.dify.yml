                reference_locks = []
                new_first = {"产品": [], "人物": []}

                if establishes_lock in ("产品", "人物"):
                    var_key = ESTABLISH_VAR[establishes_lock]
                    value = variables_used.get(var_key) or ""
                    used_nums = set(existing.get(establishes_lock, []))
                    new_num = 1
                    while new_num in used_nums:
