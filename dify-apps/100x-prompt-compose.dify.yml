            def main(wrapped_text: str) -> dict:
                import json
                import re

                BANNED = [
                    "cinematic", "professional", "studio", "stunning", "flawless", "perfect",
                    "smooth skin", "polished", "editorial", "glamour", "pristine",
                    "quietly", "deeply", "fundamentally", "remarkably", "arguably",
                    "delve", "utilize", "leverage", "robust", "streamline", "harness",
                ]
                TRAILING = "Keep lighting, color grade, and overall visual feel consistent with the reference frame."

                text = (wrapped_text or "").strip()
                errors = []

                def esc(w):
                    return re.escape(w)

                hits = [w for w in BANNED if re.search(r"\b%s\b" % esc(w), text, re.IGNORECASE)]
                if hits:
                    errors.append("[axiom4] final_prompt_wrapped(veo) 命中禁词: %s" % ", ".join(hits))
                if '"' in text:
                    errors.append("[axiom4] final_prompt_wrapped(veo) 含双引号（会触发 Veo 字幕）")
                if TRAILING not in text:
                    errors.append("[axiom4] final_prompt_wrapped(veo) 缺少一字不差的结尾固定句: %s" % TRAILING)

                result = {
                    "model": "veo",
                    "final_prompt_wrapped": text,
                    "duration_seconds": 8.0,
                    "narrative_shot_type": None,
                    "axiom4_pass": len(errors) == 0,
                    "axiom4_errors": errors,
                }
                return {"video_result_json": json.dumps(result, ensure_ascii=False)}
          variables:
            - value_selector: [wrap_veo, text]
