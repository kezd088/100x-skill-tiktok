                    conditional["problem_clause"] = ("面部和脖颈处有明显且符合年龄的%s（显老）。" % problem) if problem else ""
                if template_id == "IMG-05-before-after":
                    layout = variables_used.get("layout")
                    if layout == "上下":
                        conditional["layout_desc"] = "上图/下图"
                    elif layout == "左右":
                        conditional["layout_desc"] = "左图/右图"
                    else:
                        conditional["layout_desc"] = UNRESOLVED_LAYOUT
