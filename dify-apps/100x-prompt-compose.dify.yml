      - id: assemble_final
        type: custom
        data:
          type: code
          title: "装配最终 ComposedPromptBundle + 汇总四条公理判定"
          code_language: python3
          code: |
            def main(
                template_id: str,
                category: str,
                variables_used_json: str,
                rendered_body: str,
                reference_locks_json: str,
                established_refs_after_json: str,
                existing_refs_input_json: str,
                prep_warnings_json: str,
                render_warnings_json: str,
                model_choice_source: str,
                axiom1_pass: str,
                axiom1_errors_json: str,
                axiom2_pass: str,
                axiom2_errors_json: str,
                axiom3_pass: str,
                axiom3_errors_json: str,
                video_result_json: str,
            ) -> dict:
                import json

                TEMPLATE_NAMES = {
                    "IMG-01-product-lock": "① 产品外观锁定图（建产品参考图）",
                    "IMG-02-persona-whitebg": "② 模特白底图（建人物参考图）",
                    "IMG-03-8grid": "③ 8宫格渐变图（前后对比素材）",
                    "IMG-04-cover-hook": "④ 首图/封面图（问题特写·Hook图）",
                    "IMG-05-before-after": "⑤ 前后对比图（上下/左右）",
                    "VID-A-efficacy-stack": "⑥ 功效堆叠（一喷见效·视频）",
                    "VID-B-dual-track": "⑦ 双轨叙事（口播+震撼B-roll·视频）",
                    "VID-C-before-after": "⑧ 前后对比（护肤渐变·视频）",
                    "VID-D-talking-share": "⑨ 口播分享（真人推荐·视频）",
                    "VID-E-role-pov": "⑩ 角色视角（兽医/美容师/专家·视频）",
                    "VID-F-dark-humor": "⑪ 黑色幽默/反转（清洁·视频）",
                    "VID-G-immersive-job": "⑫ 沉浸工作流（上门清洁POV·视频）",
                    "PART-HOOK": "⑬ Hook 开头（前3秒·拼接件）",
                    "PART-CTA": "⑭ CTA 结尾（购买引导·拼接件）",
                }

                def _l(s):
                    try:
                        v = json.loads(s or "[]")
                        return v if isinstance(v, list) else []
                    except Exception:
                        return []

                def _d(s):
                    try:
                        v = json.loads(s or "{}")
                        return v if isinstance(v, dict) else {}
                    except Exception:
                        return {}

                variables_used = _d(variables_used_json)
                reference_locks = _l(reference_locks_json)
                established_after = _d(established_refs_after_json)
                existing = _d(existing_refs_input_json)
                warnings = _l(prep_warnings_json) + _l(render_warnings_json)
                video_result = _d(video_result_json)

                errors = _l(axiom1_errors_json) + _l(axiom2_errors_json) + _l(axiom3_errors_json) + (video_result.get("axiom4_errors") or [])
                ok = (axiom1_pass == "true") and (axiom2_pass == "true") and (axiom3_pass == "true") and bool(video_result.get("axiom4_pass", True))

                model = video_result.get("model")
                video_unit = None
                if category == "视频":
                    video_unit = {
                        "duration_seconds": video_result.get("duration_seconds"),
                        "final_prompt_wrapped": video_result.get("final_prompt_wrapped") or "",
                    }
                    if model == "即创":
                        video_unit["narrative_shot_type"] = video_result.get("narrative_shot_type")

                bundle = {
                    "template_id": template_id,
                    "template_name": TEMPLATE_NAMES.get(template_id, ""),
                    "category": category,
                    "variables_used": variables_used,
                    "rendered_body": rendered_body or "",
                    "reference_locks": reference_locks,
                    "model": model,
                    "video_unit": video_unit,
                    "meta": {
                        "generated_by": "100x-prompt-compose",
                        "existing_refs_input": existing,
                        "established_refs_after": established_after,
                        "model_choice_source": model_choice_source or None,
                        "warnings": warnings,
                    },
                }

                summary_lines = [
                    "模板：%s（%s）" % (template_id, TEMPLATE_NAMES.get(template_id, "")),
                    "",
                    "最终提示词：",
                    rendered_body or "",
                ]
                if video_unit:
                    summary_lines += [
                        "",
                        "模型：%s，时长：%ss" % (model, video_unit.get("duration_seconds")),
                        "包装后提示词：",
                        video_unit.get("final_prompt_wrapped") or "",
                    ]
                if errors:
                    summary_lines += ["", "未通过校验："] + ["- " + e for e in errors]

                return {
                    "ok": "true" if ok else "false",
                    "bundle_json": json.dumps(bundle, ensure_ascii=False),
                    "errors_json": json.dumps(errors, ensure_ascii=False),
                    "summary": "\n".join(summary_lines),
                }
          variables:
            - value_selector: [prep_ctx, template_id]
              variable: template_id
            - value_selector: [prep_ctx, category]
              variable: category
            - value_selector: [prep_ctx, variables_used_json]
              variable: variables_used_json
            - value_selector: [render_body, rendered_body]
              variable: rendered_body
            - value_selector: [render_body, reference_locks_json]
              variable: reference_locks_json
            - value_selector: [render_body, established_refs_after_json]
              variable: established_refs_after_json
            - value_selector: [prep_ctx, existing_refs_input_json]
              variable: existing_refs_input_json
            - value_selector: [prep_ctx, warnings_json]
              variable: prep_warnings_json
            - value_selector: [render_body, warnings_json]
              variable: render_warnings_json
            - value_selector: [prep_ctx, model_choice_source]
              variable: model_choice_source
            - value_selector: [verify_axiom1, axiom1_pass]
              variable: axiom1_pass
            - value_selector: [verify_axiom1, axiom1_errors_json]
              variable: axiom1_errors_json
            - value_selector: [verify_axiom2_3, axiom2_pass]
              variable: axiom2_pass
            - value_selector: [verify_axiom2_3, axiom2_errors_json]
              variable: axiom2_errors_json
            - value_selector: [verify_axiom2_3, axiom3_pass]
              variable: axiom3_pass
            - value_selector: [verify_axiom2_3, axiom3_errors_json]
              variable: axiom3_errors_json
            - value_selector: [merge_video, output]
              variable: video_result_json
          outputs:
            ok:
              type: string
            bundle_json:
              type: string
            errors_json:
              type: string
            summary:
              type: string
