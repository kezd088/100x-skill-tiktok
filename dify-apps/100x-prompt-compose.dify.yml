                    return str(subst[key]) if key in subst else m.group(0)

                expected = re.sub(r"\{([a-zA-Z0-9_]+)\}", sub_fn, tpl["body"])

                if template_id in ("VID-A-efficacy-stack", "VID-F-dark-humor"):
                    effect_key = variables_used.get("effect_formula")
                    lib = tpl.get("effect_library") or {}
                    replacement = lib.get(effect_key, UNRESOLVED_EFFECT_FORMULA)
                    expected = re.sub(r"【效果公式：[^】]*】", lambda m: replacement, expected, count=1)
                if template_id == "VID-F-dark-humor":
                    effect_key = variables_used.get("effect_formula")
                    lib = tpl.get("effect_library") or {}
                    replacement = lib.get(effect_key, UNRESOLVED_EFFECT_FORMULA)
                    expected = re.sub(r"【套效果公式：[^】]*】", lambda m: replacement, expected, count=1)
                if template_id == "PART-HOOK":
                    expected = expected.replace("【按 hook_type 选骨架】", "")

                actual = rendered_body or ""
                if expected != actual:
                    errors.append("[axiom1] rendered_body 不是 templates.json body 逐字 {key} 替换后的期望结果（发现意译/删减/未解析占位符），expected=%r actual=%r" % (expected, actual))
                if re.search(r"\{[a-zA-Z0-9_]+\}", actual):
                    errors.append("[axiom1] rendered_body 仍残留未替换的 {占位符}")
                for s in SENTINELS:
                    if s in actual:
                        errors.append("[axiom1] rendered_body 含内部未解析哨兵字符串 %s（hook_type/effect_formula/layout 缺失或非法，未针对 templates.json 对应 library 解析成功）" % s)

                return {
                    "axiom1_pass": "true" if not errors else "false",
                    "axiom1_errors_json": json.dumps(errors, ensure_ascii=False),
                }
          variables:
            - value_selector: [prep_ctx, template_id]
              variable: template_id
            - value_selector: [prep_ctx, category]
              variable: category
            - value_selector: [prep_ctx, variables_used_json]
