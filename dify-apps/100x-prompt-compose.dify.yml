            - value_selector: [prep_ctx, category]
              variable: category
            - value_selector: [prep_ctx, variables_used_json]
              variable: variables_used_json
            - value_selector: [prep_ctx, existing_refs_input_json]
              variable: existing_refs_input_json
            - value_selector: [prep_ctx, establishes_lock]
              variable: establishes_lock
            - value_selector: [prep_ctx, references_lock_json]
              variable: references_lock_json
