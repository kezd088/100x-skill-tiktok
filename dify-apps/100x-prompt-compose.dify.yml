                return {
                    "rendered_body": body,
                    "reference_locks_json": json.dumps(reference_locks, ensure_ascii=False),
                    "established_refs_after_json": json.dumps(established_after, ensure_ascii=False),
                    "warnings_json": json.dumps(warnings, ensure_ascii=False),
                    "render_error": "",
                }
          variables:
            - value_selector: [prep_ctx, template_id]
