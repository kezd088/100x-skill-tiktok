      - id: verify_axiom2_3
        type: custom
        data:
          type: code
          title: "公理2引用锁完整性 + 公理3场景光线词扫描"
          code_language: python3
          code: |
            def main(variables_used_json: str, reference_locks_json: str, existing_refs_input_json: str, established_refs_after_json: str) -> dict:
                import json
                import re

                LOCK_REF_ENTITY = {"product_lock": "产品", "persona_ref": "人物"}
                REF_PATTERN = re.compile(r"^参考图(\d+)(产品|人物)$")
                REF_MENTION = re.compile(r"参考图(\d+)(产品|人物)")
                LIGHTING_WORDS = [
                    "明亮阳光", "柔和灯光", "柔光", "暖光", "冷光", "逆光", "顶光", "侧光", "自然光", "摄影棚灯光", "补光灯",
                    "bright sunlight", "soft light", "soft lighting", "warm light", "warm lighting", "cool lighting",
                    "natural light", "backlit", "studio light", "studio lighting", "golden hour", "ring light", "softbox",
                ]
                SCENE_KEYS = {"scene", "scenes", "place", "rooms"}

                def _load(s, default):
                    try:
                        v = json.loads(s) if (s or "").strip() else default
                        return v
                    except Exception:
                        return default

                variables_used = _load(variables_used_json, {})
                if not isinstance(variables_used, dict):
                    variables_used = {}
                locks = _load(reference_locks_json, [])
                if not isinstance(locks, list):
                    locks = []
                existing = _load(existing_refs_input_json, {})
                if not isinstance(existing, dict):
                    existing = {}
                existing.setdefault("产品", [])
                existing.setdefault("人物", [])
                established_after = _load(established_refs_after_json, {})
                if not isinstance(established_after, dict):
                    established_after = {}

                errs2 = []
                known = {"产品": set(existing.get("产品", [])), "人物": set(existing.get("人物", []))}
                new_first = {"产品": [], "人物": []}

                for idx, lock in enumerate(locks):
                    entity = lock.get("entity")
                    status = lock.get("status")
                    value = lock.get("value", "")
                    ref_number = lock.get("ref_number")
                    if status == "reference_reuse":
                        m = REF_PATTERN.match(value or "")
                        if m:
                            num = int(m.group(1))
                            ent_from_value = m.group(2)
                            if ent_from_value != entity:
                                errs2.append("[axiom2] reference_locks[%d]: value '%s' 指向实体 '%s' 但 entity 字段是 '%s'（不一致）" % (idx, value, ent_from_value, entity))
                            if num not in known.get(entity, set()):
                                errs2.append("[axiom2] reference_locks[%d]: value '%s' 指向编号 %d，不在 meta.existing_refs_input.%s 中（未曾被此前调用建立，referential integrity 失败）" % (idx, value, num, entity))
                            if ref_number != num:
                                errs2.append("[axiom2] reference_locks[%d]: ref_number(%s) 与 value 内嵌编号(%d) 不一致" % (idx, ref_number, num))
                    else:
                        if ref_number in known.get(entity, set()):
                            errs2.append("[axiom2] reference_locks[%d]: status 是 first_lock 但 ref_number %s（实体 %s）已存在于 meta.existing_refs_input，会与已建立的锁冲突" % (idx, ref_number, entity))
                        new_first.setdefault(entity, []).append(ref_number)

                claims = []
                for key, val in variables_used.items():
                    if not isinstance(val, str):
                        continue
                    m = REF_MENTION.search(val)
                    if not m:
                        continue
                    num = int(m.group(1))
                    mentioned = m.group(2)
                    expected_entity = LOCK_REF_ENTITY.get(key, mentioned)
                    claims.append({"key": key, "entity": expected_entity, "num": num, "mentioned": mentioned, "raw": val})

                for c in claims:
                    if c["mentioned"] != c["entity"]:
                        errs2.append("[axiom2] variables_used.%s = '%s' 提及实体 '%s'，但该键按约定应指向 '%s'（不一致）" % (c["key"], c["raw"], c["mentioned"], c["entity"]))
                    if c["num"] not in known.get(c["entity"], set()):
                        errs2.append("[axiom2] variables_used.%s = '%s' 声称引用参考图%d%s，但该编号未曾被此前调用建立——即使 reference_locks[] 留空也照样检查" % (c["key"], c["raw"], c["num"], c["entity"]))
                    declared = False
                    for l in locks:
                        if l.get("status") != "reference_reuse" or l.get("entity") != c["entity"]:
                            continue
                        lm = REF_PATTERN.match(l.get("value", "") or "")
                        if lm and int(lm.group(1)) == c["num"]:
                            declared = True
                            break
                    if not declared:
                        errs2.append("[axiom2] variables_used.%s 声称引用参考图%d%s，但 reference_locks[] 没有对应的 reference_reuse 条目——渲染正文与结构化锁台账已经漂移" % (c["key"], c["num"], c["entity"]))

                if locks:
                    expected_after = {
                        "产品": sorted(set(existing.get("产品", [])) | set(new_first.get("产品", []))),
                        "人物": sorted(set(existing.get("人物", [])) | set(new_first.get("人物", []))),
                    }
                    for entity in ("产品", "人物"):
                        actual_sorted = sorted(set(established_after.get(entity, [])))
                        if actual_sorted != expected_after[entity]:
                            errs2.append("[axiom2] meta.established_refs_after.%s 是 %s，期望 %s（existing_refs_input 并上本次新建立的 first_lock 编号）" % (entity, actual_sorted, expected_after[entity]))

                errs3 = []
                for key, val in variables_used.items():
                    if key not in SCENE_KEYS or not isinstance(val, str):
                        continue
                    for w in LIGHTING_WORDS:
                        if w in val:
                            errs3.append("[axiom3] variables_used.%s = '%s' 命中禁用光线词 '%s'（光线交给 realism_suffix 统一控制，场景变量只留地点+可选天气）" % (key, val, w))

                return {
                    "axiom2_pass": "true" if not errs2 else "false",
                    "axiom2_errors_json": json.dumps(errs2, ensure_ascii=False),
                    "axiom3_pass": "true" if not errs3 else "false",
                    "axiom3_errors_json": json.dumps(errs3, ensure_ascii=False),
                }
          variables:
            - value_selector: [prep_ctx, variables_used_json]
              variable: variables_used_json
            - value_selector: [render_body, reference_locks_json]
              variable: reference_locks_json
            - value_selector: [prep_ctx, existing_refs_input_json]
              variable: existing_refs_input_json
            - value_selector: [render_body, established_refs_after_json]
              variable: established_refs_after_json
          outputs:
            axiom2_pass:
              type: string
            axiom2_errors_json:
              type: string
            axiom3_pass:
              type: string
            axiom3_errors_json:
              type: string
