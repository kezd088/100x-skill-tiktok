      - id: structural_check
        type: custom
        data:
          title: "结构层校验（plain Python 复刻 schema.json，非 ajv）"
          type: code
          code_language: python3
          code: |
            import json
            import re

            # Dify's sandboxed code node cannot `import jsonschema` or run ajv, so
            # this hand-rolls schema.json's required/enum/pattern/if-then rules in
            # plain Python stdlib. This is the "structural layer" -- the repo's own
            # AGENTS.md calls this split out explicitly (ajv-equivalent vs.
            # cross-field aggregate). See 100x-visual-fission.dify.notes.md.

            IDENTITY_ANCHOR_BANNED = [
                '某处', '某人', '某个地方', '随便', '待定', '不确定',
                'TBD', 'tbd', 'somewhere', 'Somewhere', 'SOMEWHERE',
                'anywhere', 'Anywhere', 'ANYWHERE',
                'unspecified', 'Unspecified', 'UNSPECIFIED',
                'placeholder', 'Placeholder', 'PLACEHOLDER',
                'generic', 'Generic', 'GENERIC',
            ]
            CAMERA_TABLE = {
                'A': ('natural-window', 'warm'),
                'B': ('ring-light', 'neutral'),
                'C': ('overcast-natural', 'muted'),
            }
            ASPECT_RES = {'9:16': '1080x1920', '4:5': '1080x1350', '1:1': '1080x1080'}
            STRUCTURE_FRAME_COUNT = {
                'single_frame': (1, 1),
                'head_tail': (2, 2),
                'head_mid_tail': (3, 3),
                'multi_day': (4, 8),
            }
            REALISM_SUBSTRINGS = ['shot on iPhone', 'visible pores', 'natural skin texture', 'minor imperfections', 'photorealistic']
            NEGATIVE_PROMPT_CONST = (
                'blurry, low quality, distorted, extra fingers, extra limbs, watermark, cartoon, '
                'illustration, anime, 3D render, oversaturated, plastic skin, oversmoothed, stock '
                'image feel, ring light, studio lighting, flash, artificial lighting, neon'
            )


            def is_identity_anchor(value, errors, path):
                if not isinstance(value, str) or len(value) < 3:
                    errors.append(f'[structural] {path} must be a string of at least 3 characters')
                    return
                for word in IDENTITY_ANCHOR_BANNED:
                    if word in value:
                        errors.append(f"[structural] {path} contains banned vague placeholder '{word}'")


            def check_constants(bundle, errors):
                c = bundle.get('constants')
                if not isinstance(c, dict):
                    errors.append('[structural] constants must be an object')
                    return
                for key in ('person_identity_anchor', 'scene_identity_anchor', 'product_identity_anchor'):
                    if key not in c:
                        errors.append(f'[structural] constants.{key} is required')
                    else:
                        is_identity_anchor(c[key], errors, f'constants.{key}')


            def check_variables(bundle, errors):
                v = bundle.get('variables')
                if not isinstance(v, list) or len(v) < 1:
                    errors.append('[structural] variables must be a non-empty array')
                    return
                for i, item in enumerate(v):
                    if not isinstance(item, dict):
                        errors.append(f'[structural] variables[{i}] must be an object')
                        continue
                    if item.get('dimension') not in ('camera', 'pose', 'composition'):
                        errors.append(f'[structural] variables[{i}].dimension must be one of camera/pose/composition')
                    if not isinstance(item.get('name'), str) or not item.get('name'):
                        errors.append(f'[structural] variables[{i}].name is required')
                    ov = item.get('observed_values')
                    if not isinstance(ov, list) or len(ov) < 2:
                        errors.append(f'[structural] variables[{i}].observed_values needs at least 2 items')
                    if not isinstance(item.get('range_description'), str) or not item.get('range_description'):
                        errors.append(f'[structural] variables[{i}].range_description is required')


            def check_frame_item(frame, i, errors):
                role = frame.get('role')
                if role not in ('head', 'mid', 'tail', 'day'):
                    errors.append(f'[structural] media_plan.frames[{i}].role must be one of head/mid/tail/day')
                    return
                day_index = frame.get('day_index')
                if role == 'day':
                    if not isinstance(day_index, int) or isinstance(day_index, bool) or day_index < 1:
                        errors.append(f'[structural] media_plan.frames[{i}].day_index must be an integer >=1 when role=day')
                else:
                    if day_index is not None:
                        errors.append(f'[structural] media_plan.frames[{i}].day_index must be null when role={role}')
                if not isinstance(frame.get('visual_action'), str) or not frame.get('visual_action'):
                    errors.append(f'[structural] media_plan.frames[{i}].visual_action is required')
                uses_ref = frame.get('uses_first_frame_as_reference')
                if role == 'head' and uses_ref is not False:
                    errors.append(f'[structural] media_plan.frames[{i}].uses_first_frame_as_reference must be false when role=head')
                if role in ('mid', 'tail') and uses_ref is not True:
                    errors.append(f'[structural] media_plan.frames[{i}].uses_first_frame_as_reference must be true when role={role}')


            def check_media_plan(bundle, errors):
                mp = bundle.get('media_plan')
                if not isinstance(mp, dict):
                    errors.append('[structural] media_plan must be an object')
                    return
                structure = mp.get('structure')
                if structure not in STRUCTURE_FRAME_COUNT:
                    errors.append('[structural] media_plan.structure must be one of single_frame/head_tail/head_mid_tail/multi_day')
                    return
                lo, hi = STRUCTURE_FRAME_COUNT[structure]
                frame_count = mp.get('frame_count')
                if not isinstance(frame_count, int) or isinstance(frame_count, bool) or not (lo <= frame_count <= hi):
                    errors.append(f'[structural] media_plan.frame_count must be in range [{lo},{hi}] for structure={structure}')
                frames = mp.get('frames')
                if not isinstance(frames, list) or not (1 <= len(frames) <= 8):
                    errors.append('[structural] media_plan.frames must be an array of 1 to 8 items')
                    frames = []
                for i, frame in enumerate(frames):
                    if isinstance(frame, dict):
                        check_frame_item(frame, i, errors)
                    else:
                        errors.append(f'[structural] media_plan.frames[{i}] must be an object')
                just = mp.get('structure_justification')
                if not isinstance(just, str) or not just:
                    errors.append('[structural] media_plan.structure_justification is required')
                elif structure == 'multi_day' and not re.search(r'[0-9]', just):
                    errors.append(
                        '[structural] media_plan.structure_justification must cite a digit when '
                        'structure=multi_day (known limitation: cannot verify the digit is faithful '
                        'to the source narrative -- see axioms.md axiom 2 TODO)'
                    )


            def check_prompt_sets(bundle, errors):
                ps = bundle.get('prompt_sets')
                if not isinstance(ps, list) or len(ps) < 2:
                    errors.append('[structural] prompt_sets must be an array of at least 2 items')
                    return
                for i, item in enumerate(ps):
                    if not isinstance(item, dict):
                        errors.append(f'[structural] prompt_sets[{i}] must be an object')
                        continue
                    for key in ('id', 'variant_label', 'character_prompt', 'scene_prompt', 'action_prompt', 'combined_prompt', 'axis_tags'):
                        if key not in item:
                            errors.append(f'[structural] prompt_sets[{i}].{key} is required')
                    tags = item.get('axis_tags')
                    if (not isinstance(tags, list) or not (2 <= len(tags) <= 3)
                            or len(set(tags)) != len(tags)
                            or any(t not in ('camera', 'pose', 'composition') for t in tags)):
                        errors.append(f'[structural] prompt_sets[{i}].axis_tags must be 2-3 unique values from camera/pose/composition')


            def check_fission_variant(fv, i, errors):
                for key in ('id', 'source_prompt_set_id', 'frame_role', 'day_index', 'camera_variant', 'aspect_ratio', 'prompt_json'):
                    if key not in fv:
                        errors.append(f'[structural] fission_variants[{i}].{key} is required')
                role = fv.get('frame_role')
                day_index = fv.get('day_index')
                if role == 'day':
                    if not isinstance(day_index, int) or isinstance(day_index, bool) or day_index < 1:
                        errors.append(f'[structural] fission_variants[{i}].day_index must be an integer >=1 when frame_role=day')
                elif role in ('head', 'mid', 'tail') and day_index is not None:
                    errors.append(f'[structural] fission_variants[{i}].day_index must be null when frame_role={role}')
                camera_variant = fv.get('camera_variant')
                if camera_variant not in CAMERA_TABLE:
                    errors.append(f'[structural] fission_variants[{i}].camera_variant must be one of A/B/C')
                aspect_ratio = fv.get('aspect_ratio')
                if aspect_ratio not in ASPECT_RES:
                    errors.append(f'[structural] fission_variants[{i}].aspect_ratio must be one of 9:16/4:5/1:1')
                pj = fv.get('prompt_json')
                if not isinstance(pj, dict):
                    errors.append(f'[structural] fission_variants[{i}].prompt_json must be an object')
                    return
                prompt_text = pj.get('prompt', '')
                if not isinstance(prompt_text, str) or not prompt_text:
                    errors.append(f'[structural] fission_variants[{i}].prompt_json.prompt is required')
                else:
                    for sub in REALISM_SUBSTRINGS:
                        if sub not in prompt_text:
                            errors.append(f"[structural] fission_variants[{i}].prompt_json.prompt is missing the fixed realism suffix phrase '{sub}'")
                    if camera_variant in CAMERA_TABLE:
                        lighting_kw, color_kw = CAMERA_TABLE[camera_variant]
                        low = prompt_text.lower()
                        for kw in (lighting_kw, color_kw):
                            if not re.search(r'\b' + re.escape(kw.lower()) + r'\b', low):
                                errors.append(f"[structural] fission_variants[{i}].prompt_json.prompt does not contain the required camera_variant={camera_variant} keyword '{kw}' as a whole word/phrase")
                if aspect_ratio in ASPECT_RES and pj.get('resolution') != ASPECT_RES[aspect_ratio]:
                    errors.append(f"[structural] fission_variants[{i}].prompt_json.resolution must be {ASPECT_RES.get(aspect_ratio)} for aspect_ratio={aspect_ratio}")


            def check_fission_variants(bundle, errors):
                fv = bundle.get('fission_variants')
                if not isinstance(fv, list) or len(fv) < 1:
                    errors.append('[structural] fission_variants must be a non-empty array')
                    return
                for i, item in enumerate(fv):
                    if isinstance(item, dict):
                        check_fission_variant(item, i, errors)
                    else:
                        errors.append(f'[structural] fission_variants[{i}] must be an object')


            def check_negative_prompt(bundle, errors):
                if bundle.get('negative_prompt') != NEGATIVE_PROMPT_CONST:
                    errors.append('[structural] negative_prompt must byte-equal the fixed VTP constant (user/LLM cannot edit it)')


            def check_meta(bundle, errors):
                meta = bundle.get('meta')
                if not isinstance(meta, dict):
                    errors.append('[structural] meta must be an object')
                    return
                if meta.get('based_on_media_structure') not in STRUCTURE_FRAME_COUNT:
                    errors.append('[structural] meta.based_on_media_structure must be one of single_frame/head_tail/head_mid_tail/multi_day')
                if meta.get('generated_by') != '100x-visual-fission':
                    errors.append("[structural] meta.generated_by must be the const '100x-visual-fission'")


            def main(bundle_json: str) -> dict:
                errors = []
                try:
                    bundle = json.loads(bundle_json)
                except Exception as e:
                    return {'structural_valid': 'false', 'structural_errors': [f'[structural] bundle_json is not valid JSON: {e}']}

                required_top = ['product_name', 'category', 'constants', 'variables', 'media_plan', 'prompt_sets', 'fission_variants', 'negative_prompt', 'meta']
                for key in required_top:
                    if key not in bundle:
                        errors.append(f'[structural] top-level field {key} is required')

                check_constants(bundle, errors)
                check_variables(bundle, errors)
                check_media_plan(bundle, errors)
                check_prompt_sets(bundle, errors)
                check_fission_variants(bundle, errors)
                check_negative_prompt(bundle, errors)
                check_meta(bundle, errors)

                return {
                    'structural_valid': 'true' if not errors else 'false',
                    'structural_errors': errors,
                }
          variables:
            - variable: bundle_json
              value_selector: [assemble_bundle, bundle_json]
          outputs:
            structural_valid:
              type: string
            structural_errors:
              type: array[string]
          selected: false
        position: {x: 4760, y: 160}
        positionAbsolute: {x: 4760, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 86

      - id: aggregate_check
        type: custom
        data:
          title: "跨条目聚合校验（plain Python 复刻 scripts/validate.js）"
          type: code
          code_language: python3
          code: |
            import json
            import re

            # Faithful port of skills/100x-visual-fission/scripts/validate.js's
            # aggregateChecks() -- the cross-item/cross-field rules vanilla JSON
            # Schema (and therefore the structural_check node) cannot express:
            # array-length-vs-sibling-field, ordering/sequence, referential
            # integrity, zero-orphan coverage, cross-branch byte-equality, and the
            # curated unvisualizable-claim word scan.

            UNVISUALIZABLE_CLAIM_WORDS = [
                'cellular health', 'mitochondrial', 'anti-aging', 'anti aging',
                'clinically proven', 'clinically tested', 'third party tested', 'third-party tested',
                'fda', 'nsf approved', 'doctor recommended', 'physician recommended',
                'harvard lab', 'harvard-lab', 'money back guarantee', 'money-back guarantee',
                'guarantee', 'guaranteed', 'cure', 'reverse aging', 'no side effects',
                'sin efectos secundarios', 'clínicamente probado', 'clínicamente comprobado',
                'aprobado por la fda', 'garantía de devolución', 'garantizado',
                'laboratorio de harvard', 'sin hormonas', '% off', '% de descuento',
            ]
            EXPECTED_ROLE_SEQUENCE = {
                'single_frame': ['head'],
                'head_tail': ['head', 'tail'],
                'head_mid_tail': ['head', 'mid', 'tail'],
            }
            NEGATIVE_PROMPT_CONST = (
                'blurry, low quality, distorted, extra fingers, extra limbs, watermark, cartoon, '
                'illustration, anime, 3D render, oversaturated, plastic skin, oversmoothed, stock '
                'image feel, ring light, studio lighting, flash, artificial lighting, neon'
            )


            def word_match(haystack_lower, phrase_lower):
                return re.search(r'\b' + re.escape(phrase_lower) + r'\b', haystack_lower) is not None


            def frame_key(f):
                day = f.get('day_index')
                return f"{f.get('role')}:{'null' if day is None else day}"


            def frame_count_matches_array_length(bundle, errors):
                mp = bundle.get('media_plan', {}) or {}
                declared = mp.get('frame_count')
                frames = mp.get('frames', []) or []
                actual = len(frames)
                if declared != actual:
                    errors.append(f'[axiom2] media_plan.frame_count={declared} but media_plan.frames actually has {actual} item(s)')


            def frame_sequence_check(bundle, errors):
                mp = bundle.get('media_plan', {}) or {}
                structure = mp.get('structure')
                frames = mp.get('frames', []) or []
                if structure == 'multi_day':
                    if not all(f.get('role') == 'day' for f in frames):
                        errors.append('[axiom2] media_plan.structure=multi_day but not every frame has role="day"')
                    day_indexes = [f.get('day_index') for f in frames]
                    for i in range(1, len(day_indexes)):
                        a, b = day_indexes[i - 1], day_indexes[i]
                        if not (isinstance(a, int) and isinstance(b, int) and b > a):
                            errors.append(f'[axiom2] media_plan.frames day_index is not strictly ascending at position {i} ({a} -> {b})')
                    if len(set(day_indexes)) != len(day_indexes):
                        errors.append('[axiom2] media_plan.frames has duplicate day_index values (must be distinct)')
                else:
                    expected = EXPECTED_ROLE_SEQUENCE.get(structure, [])
                    actual = [f.get('role') for f in frames]
                    if actual != expected:
                        errors.append(f'[axiom2] media_plan.structure={structure} requires frame roles in order {expected} but got {actual}')


            def day_frame_first_reference_check(bundle, errors):
                mp = bundle.get('media_plan', {}) or {}
                frames = mp.get('frames', []) or []
                day_frames = [f for f in frames if f.get('role') == 'day' and isinstance(f.get('day_index'), int)]
                if not day_frames:
                    return
                min_day_index = min(f['day_index'] for f in day_frames)
                for f in day_frames:
                    expected = f['day_index'] != min_day_index
                    if f.get('uses_first_frame_as_reference') != expected:
                        errors.append(
                            f"[axiom2] media_plan.frames day_index={f['day_index']} (minimum is {min_day_index}) "
                            f"has uses_first_frame_as_reference={f.get('uses_first_frame_as_reference')}, expected {expected}"
                        )


            def identity_lock_check(bundle, errors):
                constants = bundle.get('constants', {}) or {}
                anchors = [
                    ('person_identity_anchor', (constants.get('person_identity_anchor') or '').lower()),
                    ('scene_identity_anchor', (constants.get('scene_identity_anchor') or '').lower()),
                    ('product_identity_anchor', (constants.get('product_identity_anchor') or '').lower()),
                ]
                for i, ps in enumerate(bundle.get('prompt_sets', []) or []):
                    text = (ps.get('combined_prompt') or '').lower()
                    for label, anchor in anchors:
                        if anchor and anchor not in text:
                            errors.append(f'[axiom1] prompt_sets[{i}].combined_prompt does not contain constants.{label} verbatim (identity lock broken)')
                for i, fv in enumerate(bundle.get('fission_variants', []) or []):
                    text = ((fv.get('prompt_json') or {}).get('prompt') or '').lower()
                    for label, anchor in anchors:
                        if anchor and anchor not in text:
                            errors.append(f'[axiom1] fission_variants[{i}].prompt_json.prompt does not contain constants.{label} verbatim (identity lock broken)')


            def prompt_sets_distinct_check(bundle, errors):
                seen = {}
                for i, ps in enumerate(bundle.get('prompt_sets', []) or []):
                    key = (ps.get('combined_prompt') or '').strip().lower()
                    if key in seen:
                        errors.append(f'[axiom1] prompt_sets[{i}].combined_prompt is byte-identical to prompt_sets[{seen[key]}] (must be pairwise distinct)')
                    else:
                        seen[key] = i


            def fission_referential_integrity_check(bundle, errors):
                prompt_set_ids = {ps.get('id') for ps in (bundle.get('prompt_sets', []) or [])}
                frame_keys = {frame_key(f) for f in (bundle.get('media_plan', {}).get('frames', []) or [])}
                for i, fv in enumerate(bundle.get('fission_variants', []) or []):
                    if fv.get('source_prompt_set_id') not in prompt_set_ids:
                        errors.append(f"[axiom3] fission_variants[{i}].source_prompt_set_id={fv.get('source_prompt_set_id')} does not match any prompt_sets[].id")
                    key = frame_key({'role': fv.get('frame_role'), 'day_index': fv.get('day_index')})
                    if key not in frame_keys:
                        errors.append(f"[axiom3] fission_variants[{i}] (frame_role={fv.get('frame_role')}, day_index={fv.get('day_index')}) does not match any media_plan.frames[] entry")


            def frame_coverage_check(bundle, errors):
                referenced = {frame_key({'role': fv.get('frame_role'), 'day_index': fv.get('day_index')}) for fv in (bundle.get('fission_variants', []) or [])}
                for i, f in enumerate(bundle.get('media_plan', {}).get('frames', []) or []):
                    if frame_key(f) not in referenced:
                        errors.append(f"[axiom3] media_plan.frames[{i}] (role={f.get('role')}, day_index={f.get('day_index')}) is never referenced by any fission_variants[] entry (orphan frame)")


            def negative_prompt_consistency_check(bundle, errors):
                top = bundle.get('negative_prompt')
                for i, fv in enumerate(bundle.get('fission_variants', []) or []):
                    np_val = (fv.get('prompt_json') or {}).get('negative_prompt')
                    if np_val != top:
                        errors.append(f'[axiom4] fission_variants[{i}].prompt_json.negative_prompt does not byte-equal the top-level negative_prompt constant')


            def meta_consistency_check(bundle, errors):
                meta = bundle.get('meta', {}) or {}
                mp = bundle.get('media_plan', {}) or {}
                if meta.get('based_on_media_structure') != mp.get('structure'):
                    errors.append(f"[axiom2] meta.based_on_media_structure=\"{meta.get('based_on_media_structure')}\" does not equal media_plan.structure=\"{mp.get('structure')}\"")


            def unvisualizable_claim_check(bundle, errors):
                surfaces = []
                for f in bundle.get('media_plan', {}).get('frames', []) or []:
                    surfaces.append(f.get('visual_action'))
                for ps in bundle.get('prompt_sets', []) or []:
                    surfaces += [ps.get('character_prompt'), ps.get('scene_prompt'), ps.get('action_prompt'), ps.get('combined_prompt')]
                for fv in bundle.get('fission_variants', []) or []:
                    surfaces.append((fv.get('prompt_json') or {}).get('prompt'))
                full_text = ' \n '.join([s for s in surfaces if s]).lower()
                hits = [w for w in UNVISUALIZABLE_CLAIM_WORDS if word_match(full_text, w.lower())]
                if hits:
                    errors.append(f"[axiom4] found {len(hits)} unvisualizable/exaggerated-claim phrase(s) copied literally into visual prompt text: {'; '.join(hits)}")


            def main(bundle_json: str) -> dict:
                errors = []
                try:
                    bundle = json.loads(bundle_json)
                except Exception as e:
                    return {'aggregate_valid': 'false', 'aggregate_errors': [f'[aggregate] bundle_json is not valid JSON: {e}']}

                frame_count_matches_array_length(bundle, errors)
                frame_sequence_check(bundle, errors)
                day_frame_first_reference_check(bundle, errors)
                identity_lock_check(bundle, errors)
                prompt_sets_distinct_check(bundle, errors)
                fission_referential_integrity_check(bundle, errors)
                frame_coverage_check(bundle, errors)
                negative_prompt_consistency_check(bundle, errors)
                meta_consistency_check(bundle, errors)
                unvisualizable_claim_check(bundle, errors)

                return {
                    'aggregate_valid': 'true' if not errors else 'false',
                    'aggregate_errors': errors,
                }
          variables:
            - variable: bundle_json
              value_selector: [assemble_bundle, bundle_json]
          outputs:
            aggregate_valid:
              type: string
            aggregate_errors:
              type: array[string]
          selected: false
        position: {x: 5060, y: 160}
        positionAbsolute: {x: 5060, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 86

