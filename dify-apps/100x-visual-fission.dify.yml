      - id: build_fission_tasks
        type: custom
        data:
          title: "06 裂变前置：每帧×机位×画幅 任务列表（零孤儿由构造保证）"
          type: code
          code_language: python3
          code: |
            import json

            # VTP 06 fixed lookup tables (vtp_prompts_06-meta-prompt.md), same
            # constants as schema.json's if/then blocks and scripts/validate.js.
            ASPECT_RES = {'9:16': '1080x1920', '4:5': '1080x1350', '1:1': '1080x1080'}
            CAMERA_TABLE = {
                'A': ('natural-window', 'warm'),
                'B': ('ring-light', 'neutral'),
                'C': ('overcast-natural', 'muted'),
            }
            CAMERA_ORDER = ['A', 'B', 'C']


            def main(media_plan_json: str, prompt_sets_json: str, aspect_ratios_csv: str) -> dict:
                try:
                    media_plan = json.loads(media_plan_json)
                except Exception:
                    media_plan = {}
                try:
                    prompt_sets = json.loads(prompt_sets_json)
                except Exception:
                    prompt_sets = []
                frames = media_plan.get('frames') if isinstance(media_plan.get('frames'), list) else []
                ratios = [r.strip() for r in (aspect_ratios_csv or '9:16').split(',') if r.strip()] or ['9:16']
                prompt_set_ids = [ps.get('id') for ps in prompt_sets if isinstance(ps, dict) and 'id' in ps]
                if not prompt_set_ids:
                    prompt_set_ids = [1]

                # By CONSTRUCTION every frame gets exactly one task (axiom-3 zero-orphan
                # is guaranteed structurally here, not merely hoped for), cycling
                # through the fixed A/B/C camera table and the requested aspect
                # ratios so >=1 fission_variant covers every planned frame.
                tasks = []
                for i, frame in enumerate(frames):
                    camera_variant = CAMERA_ORDER[i % 3]
                    lighting_kw, color_kw = CAMERA_TABLE[camera_variant]
                    aspect_ratio = ratios[i % len(ratios)]
                    resolution = ASPECT_RES.get(aspect_ratio, '1080x1920')
                    source_id = prompt_set_ids[i % len(prompt_set_ids)]
                    source_ps = next((ps for ps in prompt_sets if isinstance(ps, dict) and ps.get('id') == source_id), {})
                    task = {
                        'id': i + 1,
                        'source_prompt_set_id': source_id,
                        'source_combined_prompt': source_ps.get('combined_prompt', ''),
                        'frame_role': frame.get('role'),
                        'day_index': frame.get('day_index'),
                        'visual_action': frame.get('visual_action', ''),
                        'camera_variant': camera_variant,
                        'lighting_keyword': lighting_kw,
                        'color_keyword': color_kw,
                        'aspect_ratio': aspect_ratio,
                        'resolution': resolution,
                    }
                    tasks.append(json.dumps(task, ensure_ascii=False))
                return {'fission_tasks': tasks, 'fission_tasks_count': len(tasks)}
          variables:
            - variable: media_plan_json
              value_selector: [parse_media_plan, media_plan_json]
            - variable: prompt_sets_json
              value_selector: [assemble_prompt_sets, prompt_sets_json]
            - variable: aspect_ratios_csv
              value_selector: [intake_check, aspect_ratios_csv]
          outputs:
            fission_tasks:
              type: array[string]
            fission_tasks_count:
              type: number
          selected: false
