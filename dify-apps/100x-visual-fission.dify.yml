          code: |
            import json
            import re


            def extract_json(text):
                text = (text or '').strip()
                m = re.search(r'```(?:json)?\s*(\{.*\})\s*```', text, re.DOTALL)
                if m:
                    text = m.group(1)
                else:
                    start = text.find('{')
                    end = text.rfind('}')
                    if start != -1 and end != -1 and end > start:
                        text = text[start:end + 1]
                return text


            def main(items: list) -> dict:
                sets = []
                errors = []
                for i, raw in enumerate(items or []):
                    candidate = extract_json(raw)
                    try:
                        obj = json.loads(candidate)
                        sets.append(obj)
                    except Exception as e:
                        errors.append(f'prompt_sets_iter item {i} was not valid JSON: {e}')
                return {
                    'prompt_sets_json': json.dumps(sets, ensure_ascii=False),
                    'prompt_sets_count': len(sets),
                    'parse_errors_csv': '; '.join(errors),
                }
          variables:
