app:
  name: "100x-visual-fission · 媒介裂变提示词矩阵"
  description: "锁定人物/场景/产品三锚点，把≥2条同系列参考+产品文案裂变成媒介结构×VTP机位预设的提示词矩阵（single_frame/head_tail/head_mid_tail/multi_day × A/B/C camera presets），附固定负面词常量。移植自 100x-skill-tiktok 仓库 skills/100x-visual-fission。"
  icon: "🎬"
  icon_type: emoji
  icon_background: "#FDE7C8"
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: "0.7.0"
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.6@e2665624a156f52160927bceac9e169bd7e5ae6b936ae82575e14c90af390e6e
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    viewport: {x: 0, y: 0, zoom: 0.4}
    nodes:
      - id: start
        type: custom
        data:
          title: "输入 / Start"
          type: start
          variables:
            - label: "参考材料 references[]（≥2条，JSON数组或每行一条文字描述）"
              variable: references_input
              type: paragraph
              required: true
              max_length: 20000
            - label: "产品文案 product_brief（产品名+品类+效果卖点叙事）"
              variable: product_brief
              type: paragraph
              required: true
              max_length: 8000
            - label: "品类 product_category（可选，默认：通用）"
              variable: product_category
              type: text-input
              required: false
              max_length: 100
            - label: "目标画幅 aspect_ratios_wanted（可选，逗号分隔，取值 9:16/4:5/1:1，默认 9:16）"
              variable: aspect_ratios_wanted
              type: text-input
              required: false
              max_length: 50
            - label: "变体组数 variant_count（可选，默认 2，VTP 04 步用户自定参数，非结构性判据）"
              variable: variant_count
              type: number
              required: false
            - label: "上游 100x-persona PersonaSceneBundle JSON（可选，类别C，缺失静默跳过）"
              variable: persona_bundle_json
              type: paragraph
              required: false
              max_length: 20000
        position: {x: 40, y: 340}
        positionAbsolute: {x: 40, y: 340}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 168

      - id: intake_check
        type: custom
        data:
          title: "Phase1 接收+校验（类别A/B + 不可视化宣称预检测）"
          type: code
          code_language: python3
          code: |
            import json
            import re

            # Ported verbatim from skills/100x-visual-fission/scripts/validate.js
            # UNVISUALIZABLE_CLAIM_WORDS (axiom 4). Known limitation preserved from
            # the source skill: only validated against supplement-category EN+ES
            # real corpus so far -- see notes.md / axioms.md axiom 4 TODO.
            UNVISUALIZABLE_CLAIM_WORDS = [
                'cellular health', 'mitochondrial', 'anti-aging', 'anti aging',
                'clinically proven', 'clinically tested', 'third party tested', 'third-party tested',
                'fda', 'nsf approved', 'doctor recommended', 'physician recommended',
                'harvard lab', 'harvard-lab', 'money back guarantee', 'money-back guarantee',
                'guarantee', 'guaranteed', 'cure', 'reverse aging', 'no side effects',
                'sin efectos secundarios', 'clínicamente probado', 'clínicamente comprobado',
                'aprobado por la fda', 'garantía de devolución', 'garantizado',
                'laboratorio de harvard', 'sin hormonas', '% off', '% de descuento',
            ]


            def word_match(haystack_lower, phrase_lower):
                # \b-bounded whole word/phrase match -- same fix validate.js's v1.1
                # applied after bare substring .includes() false-positived on
                # 'cure' inside 'secure'/'manicure'.
                pattern = r'\b' + re.escape(phrase_lower) + r'\b'
                return re.search(pattern, haystack_lower) is not None


            def main(references_input: str, product_brief: str, product_category: str,
                     aspect_ratios_wanted: str, variant_count: float, persona_bundle_json: str) -> dict:
                warnings = []

                # ---- class A: references[] (>=2) -------------------------------
                # Distinguishes workflow.md Phase 1's two input forms: (a) already-
                # reversed JSON objects (vtp_prompts_01/02 schema) vs (b) plain-text
                # description degrade (no real reference image) -- (a) only when the
                # WHOLE list parses as JSON objects, not merely as a JSON-parseable
                # string; anything else (parse failure, plain strings, mixed) counts
                # as the degraded path, which must be disclosed honestly downstream
                # (source_material_note, assembled in assemble_bundle).
                raw = (references_input or '').strip()
                refs = []
                all_structured = False
                if raw:
                    try:
                        parsed = json.loads(raw)
                        if isinstance(parsed, list) and len(parsed) > 0 and all(isinstance(item, dict) for item in parsed):
                            refs = [json.dumps(item, ensure_ascii=False) for item in parsed]
                            all_structured = True
                        elif isinstance(parsed, list):
                            refs = [
                                json.dumps(item, ensure_ascii=False) if isinstance(item, (dict, list)) else str(item)
                                for item in parsed
                            ]
                        else:
                            refs = [line.strip() for line in raw.splitlines() if line.strip()]
                    except Exception:
                        refs = [line.strip() for line in raw.splitlines() if line.strip()]
                references_count = len(refs)
                references_degraded = 'false' if all_structured else 'true'
                brief = (product_brief or '').strip()

                valid = references_count >= 2 and len(brief) > 0
                reject_reason = ''
                if references_count < 2:
                    reject_reason = (
                        '媒介裂变至少需要 2 条同系列参考材料（反推 JSON 或文字描述都可以）才能分离定量和'
                        '变量，只有 1 条没法比较哪些在变、哪些不变。'
                    )
                elif not brief:
                    reject_reason = '产品是什么、期望看到什么变化，还没有拿到 product_brief，无法继续。'

                # ---- class B: soft defaults -------------------------------------
                allowed_ratios = {'9:16', '4:5', '1:1'}
                ratios = [r.strip() for r in (aspect_ratios_wanted or '').split(',') if r.strip()]
                ratios = [r for r in ratios if r in allowed_ratios]
                if not ratios:
                    ratios = ['9:16']
                    warnings.append('aspect_ratios_wanted 未指定或无有效取值，已用默认值 9:16')

                vcount = int(variant_count) if variant_count else 0
                if vcount < 2:
                    warnings.append('variant_count 未指定或小于 2，已用默认值 2')
                    vcount = 2
                if vcount > 8:
                    warnings.append(
                        f'variant_count={vcount} 超出工程安全上限，已截断为 8'
                        '（VTP 原设计本身不设上限，这是本次 Dify 移植新增的保护措施，非 schema.json 判据）'
                    )
                    vcount = 8

                # ---- Phase 1 step 5: unvisualizable-claim prescan (informational,
                # feeds Phase 2 rewrite instructions -- does not block generation) --
                brief_lower = brief.lower()
                hits = [w for w in UNVISUALIZABLE_CLAIM_WORDS if word_match(brief_lower, w.lower())]

                category = (product_category or '').strip() or '通用'
                kb_query = f'{category} | {brief[:300]}'

                return {
                    'valid': 'true' if valid else 'false',
                    'reject_reason': reject_reason,
                    'references_json': json.dumps(refs, ensure_ascii=False),
                    'references_count': references_count,
                    'references_degraded': references_degraded,
                    'product_brief_echo': brief,
                    'aspect_ratios_csv': ','.join(ratios),
                    'variant_count': vcount,
                    'unvisualizable_hits_csv': '; '.join(hits),
                    'category': category,
                    'kb_query': kb_query,
                    'warnings': warnings,
                }
          variables:
            - variable: references_input
              value_selector: [start, references_input]
            - variable: product_brief
              value_selector: [start, product_brief]
            - variable: product_category
              value_selector: [start, product_category]
            - variable: aspect_ratios_wanted
              value_selector: [start, aspect_ratios_wanted]
            - variable: variant_count
              value_selector: [start, variant_count]
            - variable: persona_bundle_json
              value_selector: [start, persona_bundle_json]
          outputs:
            valid:
              type: string
            reject_reason:
              type: string
            references_json:
              type: string
            references_count:
              type: number
            references_degraded:
              type: string
            product_brief_echo:
              type: string
            aspect_ratios_csv:
              type: string
            variant_count:
              type: number
            unvisualizable_hits_csv:
              type: string
            category:
              type: string
            kb_query:
              type: string
            warnings:
              type: array[string]
          selected: false
        position: {x: 320, y: 340}
        positionAbsolute: {x: 320, y: 340}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 86

      - id: gate_class_a
        type: custom
        data:
          title: "类别A 齐全？"
          type: if-else
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - id: cond-class-a-valid
                  variable_selector: [intake_check, valid]
                  comparison_operator: is
                  value: "true"
                  varType: string
          desc: ""
        position: {x: 620, y: 340}
        positionAbsolute: {x: 620, y: 340}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 126

      - id: end_rejected
        type: custom
        data:
          title: "结束（类别A缺失，拒绝+追问）"
          type: end
          outputs:
            - variable: reject_reason
              value_selector: [intake_check, reject_reason]
            - variable: references_count
              value_selector: [intake_check, references_count]
        position: {x: 920, y: 560}
        positionAbsolute: {x: 920, y: 560}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 90

      - id: kb_retrieve
        type: custom
        data:
          title: "知识检索：同品类历史 prompt_sets（占位 dataset_id）"
          type: knowledge-retrieval
          dataset_ids:
            - "REPLACE_WITH_DATASET_ID"
          query_variable_selector: [intake_check, kb_query]
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 4
            reranking_enable: false
            score_threshold_enabled: false
            score_threshold: 0
          metadata_filtering_mode: disabled
          selected: false
        position: {x: 920, y: 160}
        positionAbsolute: {x: 920, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 88

      - id: extract_common
        type: custom
        data:
          title: "03 extract-common（constants/variables）"
          type: llm
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: extract-common-sys
              role: system
              text: |
                You are the VTP step-03 "extract-common" engine (100x-visual-fission Phase 2B).
                Given >=2 person/scene references (either vision-reversed JSON or text-description
                degrades) and a product_brief, separate:

                - constants: fields identical or semantically equivalent across ALL references ->
                  person_identity_anchor (specific, non-vague description of the person),
                  scene_identity_anchor (specific, non-vague description of the location),
                  product_identity_anchor (specific description of the product's appearance,
                  derived from product_brief). Each anchor must be a concrete, specific sentence
                  fragment of at least a few words -- never a vague placeholder like "someone",
                  "somewhere", "a generic person", "TBD", "unspecified", "placeholder".
                - variables: fields that DIFFER across references, at LEAF-FIELD granularity (do
                  not write "clothing differs" -- write "top style differs (hoodie vs t-shirt)
                  while bottoms stay constant (black joggers)"), grouped by dimension: camera /
                  pose / composition, each with >=2 observed_values and a range_description.

                If a PersonaSceneBundle is supplied below (persona_bundle_json) and non-empty, its
                identity fields are already human-verified -- reuse them directly for
                person_identity_anchor/scene_identity_anchor instead of re-deriving from
                references (this is the class-C shortcut, skip re-analysis). If it is empty,
                derive anchors from references[] yourself.

                You may also see prior similar prompt-set patterns retrieved from a knowledge base
                for the same product category, given as background context -- use them ONLY as
                style inspiration for phrasing, never as a source of facts about THIS
                product/person/scene.

                Do not invent facts not present in references/product_brief. Do not use banned
                aesthetic filler words: attractive, beautiful, stunning, serene, pristine, elegant,
                cinematic, professional, studio, flawless.

                Output STRICT JSON ONLY, no prose, no markdown fences, matching exactly:
                {"constants": {"person_identity_anchor": "...", "scene_identity_anchor": "...",
                "product_identity_anchor": "..."}, "variables": [{"dimension":
                "camera|pose|composition", "name": "...", "observed_values": ["...", "..."],
                "range_description": "..."}]}
            - id: extract-common-user
              role: user
              text: |
                references (>=2, JSON objects or text-description degrades):
                {{#intake_check.references_json#}}

                product_brief:
                {{#intake_check.product_brief_echo#}}

                persona_bundle_json (class C, optional, empty if not supplied):
                {{#start.persona_bundle_json#}}
          context:
            enabled: true
            variable_selector: [kb_retrieve, result]
          variables: []
          vision:
            enabled: false
          selected: false
        position: {x: 1200, y: 160}
        positionAbsolute: {x: 1200, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 98

      - id: classify_structure
        type: custom
        data:
          title: "媒介结构判定（本skill新增，四选一）"
          type: question-classifier
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0
          query_variable_selector: [intake_check, product_brief_echo]
          classes:
            - id: single_frame
              name: single_frame
            - id: head_tail
              name: head_tail
            - id: head_mid_tail
              name: head_mid_tail
            - id: multi_day
              name: multi_day
          instruction: |
            Classify the product_brief's effect narrative into EXACTLY one of four fixed
            media-fission structures (this skill's original "媒介裂变" axis, layered on top of
            VTP's camera/lighting/color axis -- see 功效堆叠与多帧结构.md):
            - "single_frame": no before/after or stacking, a pure single product/selling-point
              shot.
            - "head_tail": only a before-vs-after two-point contrast, no middle transition, no
              explicit day markers.
            - "head_mid_tail": one continuous single-session process (apply -> absorb -> visible
              change), NOT spanning multiple days.
            - "multi_day": the narrative cites 3 or more explicit time-point markers (e.g. "day
              1", "第 3 天", "a week later", "within 24 hours").
            Choose the single best-fitting class name exactly as given (single_frame / head_tail /
            head_mid_tail / multi_day). When in doubt between head_tail and head_mid_tail, prefer
            head_tail unless a distinct middle transition moment is explicitly narrated.
          vision:
            enabled: false
          selected: false
        position: {x: 1500, y: 160}
        positionAbsolute: {x: 1500, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 166

      - id: plan_frames
        type: custom
        data:
          title: "2C 媒介结构判定内容填充（帧计划+justification）"
          type: llm
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.3
          prompt_template:
            - id: plan-frames-sys
              role: system
              text: |
                You are the VTP "media-structure frame planner" (100x-visual-fission Phase 2 step
                2C). You are given: (1) which media_structure was already classified (one of
                single_frame/head_tail/head_mid_tail/multi_day -- DO NOT re-decide it, just apply
                its FIXED rule below), (2) the locked constants/variables from step 03, (3) the
                raw product_brief.

                Apply EXACTLY the fixed rule for the given structure (this is a closed
                deterministic table, not a judgment call -- axiom 2):
                - single_frame: EXACTLY 1 frame, role="head", day_index=null,
                  uses_first_frame_as_reference=false.
                - head_tail: EXACTLY 2 frames, roles in this exact order ["head","tail"],
                  day_index=null for both, uses_first_frame_as_reference=false for head / true for
                  tail.
                - head_mid_tail: EXACTLY 3 frames, roles in this exact order
                  ["head","mid","tail"], day_index=null for all, uses_first_frame_as_reference=
                  false for head / true for mid and tail.
                - multi_day: 4 to 8 frames, ALL role="day", day_index = the REAL day numbers
                  explicitly cited in product_brief (e.g. if the brief only ever says day
                  3/7/14/30, day_index must literally be 3,7,14,30 -- never renumber to 1,2,3,4),
                  strictly ascending, distinct. The frame with the SMALLEST day_index gets
                  uses_first_frame_as_reference=false; every other day frame gets true and its
                  visual_action must literally say it uses frame 1 as reference with the rest
                  unchanged. If the brief cites fewer than 4 explicit time points, you may
                  interpolate one additional plausible intermediate day frame to reach the 4-frame
                  minimum, but you MUST say so honestly in structure_justification (e.g. "day X is
                  interpolated, not directly asserted by the source brief") -- never silently
                  invent a time point.

                For EVERY frame's visual_action: describe a genuinely photographable action/pose/
                texture change. If product_brief contains an unvisualizable or exaggerated
                marketing claim (pre-flagged hits: {{#intake_check.unvisualizable_hits_csv#}}),
                you MUST NOT copy that claim sentence into visual_action -- rewrite it as a
                concrete, camera-visible action or texture change instead (e.g. "melts fat
                overnight" -> "waistline looking visibly more toned").

                structure_justification must name the specific timeline/narrative cue from
                product_brief that drove the structure choice; if structure=multi_day it MUST cite
                at least one digit.

                Do not invent facts absent from constants/variables/product_brief. Do not use
                banned aesthetic filler words: attractive, beautiful, stunning, serene, pristine,
                elegant, cinematic, professional, studio, flawless.

                Output STRICT JSON ONLY, no prose, no markdown fences, matching exactly:
                {"structure": "<echo the given structure>", "frame_count": <int>, "frames":
                [{"role": "...", "day_index": <int or null>, "visual_action": "...",
                "uses_first_frame_as_reference": <bool>}, ...], "structure_justification": "..."}
            - id: plan-frames-user
              role: user
              text: |
                media_structure (already classified): {{#classify_structure.class_name#}}

                constants + variables (from step 03):
                {{#extract_common.text#}}

                product_brief:
                {{#intake_check.product_brief_echo#}}
          context:
            enabled: false
            variable_selector: []
          variables: []
          vision:
            enabled: false
          selected: false
        position: {x: 1800, y: 160}
        positionAbsolute: {x: 1800, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 98

      - id: parse_media_plan
        type: custom
        data:
          title: "解析 media_plan JSON（轻量解析，不做公理判定）"
          type: code
          code_language: python3
          code: |
            import json
            import re


            def extract_json(text):
                text = (text or '').strip()
                m = re.search(r'```(?:json)?\s*(\{.*\})\s*```', text, re.DOTALL)
                if m:
                    text = m.group(1)
                else:
                    start = text.find('{')
                    end = text.rfind('}')
                    if start != -1 and end != -1 and end > start:
                        text = text[start:end + 1]
                return text


            def main(raw_text: str) -> dict:
                candidate = extract_json(raw_text)
                try:
                    obj = json.loads(candidate)
                    ok = True
                    err = ''
                except Exception as e:
                    obj = {'structure': 'head_tail', 'frame_count': 0, 'frames': [], 'structure_justification': ''}
                    ok = False
                    err = f'plan_frames output was not valid JSON: {e}'
                frames = obj.get('frames') if isinstance(obj.get('frames'), list) else []
                return {
                    'media_plan_json': json.dumps(obj, ensure_ascii=False),
                    'structure_name': obj.get('structure', ''),
                    'frame_count_declared': obj.get('frame_count', 0) or 0,
                    'frames_actual_count': len(frames),
                    'parse_ok': 'true' if ok else 'false',
                    'parse_error': err,
                }
          variables:
            - variable: raw_text
              value_selector: [plan_frames, text]
          outputs:
            media_plan_json:
              type: string
            structure_name:
              type: string
            frame_count_declared:
              type: number
            frames_actual_count:
              type: number
            parse_ok:
              type: string
            parse_error:
              type: string
          selected: false
        position: {x: 2100, y: 160}
        positionAbsolute: {x: 2100, y: 160}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 86

      - id: build_variant_hints
        type: custom
        data:
          title: "04 生成前置：N组variant轴分配（保证两两可区分）"
          type: code
          code_language: python3
          code: |
            import json

            # Deterministic camera/pose/composition axis palette so that each of the
            # N prompt_sets is GUARANTEED (by construction, not by hoping the LLM
            # self-coordinates across independent iteration runs) to vary on >=2
            # axes and start from a different concrete value -- operationalizes VTP
            # 04's "each prompt_set must vary on >=2 axes" rule and sets up
            # promptSetsDistinctCheck to actually find real differences downstream.
            AXIS_PALETTE = [
                {'axis_tags': ['camera', 'pose'], 'camera_value': 'medium full-body establishing shot', 'pose_value': 'side-on stance', 'composition_value': None},
                {'axis_tags': ['camera', 'composition'], 'camera_value': 'tight close-up', 'pose_value': None, 'composition_value': 'front-on, product-hero composition'},
                {'axis_tags': ['pose', 'composition'], 'camera_value': None, 'pose_value': 'three-quarter turn stance', 'composition_value': 'off-center rule-of-thirds composition'},
                {'axis_tags': ['camera', 'pose', 'composition'], 'camera_value': 'wide establishing shot', 'pose_value': 'walking mid-motion', 'composition_value': 'environmental wide composition'},
                {'axis_tags': ['camera', 'composition'], 'camera_value': 'low-angle medium shot', 'pose_value': None, 'composition_value': 'flat-lay product composition'},
                {'axis_tags': ['camera', 'pose'], 'camera_value': 'high-angle close-up', 'pose_value': 'seated relaxed stance', 'composition_value': None},
            ]


            def main(variant_count: float) -> dict:
                n = int(variant_count) if variant_count else 2
                n = max(2, min(n, 8))
                hints = []
                for i in range(n):
                    base = AXIS_PALETTE[i % len(AXIS_PALETTE)]
                    hint = {
                        'index': i + 1,
                        'axis_tags': base['axis_tags'],
                        'camera_value': base['camera_value'],
                        'pose_value': base['pose_value'],
                        'composition_value': base['composition_value'],
                    }
                    hints.append(json.dumps(hint, ensure_ascii=False))
                return {'variant_hints': hints, 'variant_target_count': n}
          variables:
            - variable: variant_count
              value_selector: [intake_check, variant_count]
          outputs:
            variant_hints:
              type: array[string]
            variant_target_count:
              type: number
          selected: false
        position: {x: 2400, y: 160}
