      # ---------------------------------------------------------------
      # 12. 成功分支：组装完整 bundle
      # ---------------------------------------------------------------
      - id: assemble_bundle
        type: custom
        position: { x: 3400, y: 300 }
        positionAbsolute: { x: 3400, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "组装完整 bundle（人物+夸张反差+场景）"
          type: code
          selected: false
          code_language: python3
          code: |
            import json


            def main(
                source_script: str,
                effective_hat_level: str,
                effective_market: str,
                calibrate_warnings: list,
                personas: dict,
                persona_warnings: list,
                exaggeration_beats: list,
                contrast_beats: list,
                scenes: dict,
            ) -> dict:
                warnings = list(calibrate_warnings or []) + list(persona_warnings or [])
                bundle = {
                    "source_script": source_script or "",
                    "meta": {
                        "generated_by": "step2-persona-exaggerate-scene",
                        "hat_level": effective_hat_level or "",
                        "market": effective_market or "",
                        "warnings": warnings,
                    },
                    "personas": personas or {},
                    "exaggeration_beats": exaggeration_beats or [],
                    "contrast_beats": contrast_beats or [],
                    "scenes": scenes or {},
                }
                bundle_json = json.dumps(bundle, ensure_ascii=False, indent=2)
                personas_list = [dict(v, persona_id=k) for k, v in (personas or {}).items() if isinstance(v, dict)]
                scenes_list = [dict(v, scene_id=k) for k, v in (scenes or {}).items() if isinstance(v, dict)]
                return {
                    "status": "passed",
                    "bundle": bundle,
                    "bundle_json": bundle_json,
                    "personas_list": personas_list,
                    "scenes_list": scenes_list,
                }
          variables:
            - value_selector: [start, source_script]
              variable: source_script
            - value_selector: [calibrate_ceiling, effective_hat_level]
              variable: effective_hat_level
            - value_selector: [calibrate_ceiling, effective_market]
              variable: effective_market
            - value_selector: [calibrate_ceiling, warnings]
              variable: calibrate_warnings
            - value_selector: [code_validate_persona, personas]
              variable: personas
            - value_selector: [code_validate_persona, warnings]
              variable: persona_warnings
            - value_selector: [code_validate_exaggerate, exaggeration_beats]
              variable: exaggeration_beats
            - value_selector: [code_validate_exaggerate, contrast_beats]
              variable: contrast_beats
            - value_selector: [code_validate_scene, scenes]
              variable: scenes
          outputs:
            status:
              type: string
            bundle:
              type: object
            bundle_json:
              type: string
            personas_list:
              type: array[object]
            scenes_list:
              type: array[object]

      # ---------------------------------------------------------------
      # 13. 人类可读 Markdown 摘要
      # ---------------------------------------------------------------
      - id: render_summary_md
        type: custom
        position: { x: 3680, y: 300 }
        positionAbsolute: { x: 3680, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "拼装：人类可读 Markdown 摘要"
          type: template-transform
          selected: false
          variables:
            - variable: hat_level
              value_selector: [calibrate_ceiling, effective_hat_level]
            - variable: market
              value_selector: [calibrate_ceiling, effective_market]
            - variable: warnings_a
              value_selector: [calibrate_ceiling, warnings]
            - variable: warnings_b
              value_selector: [code_validate_persona, warnings]
            - variable: personas_list
              value_selector: [assemble_bundle, personas_list]
            - variable: exaggeration_beats
              value_selector: [code_validate_exaggerate, exaggeration_beats]
            - variable: contrast_beats
              value_selector: [code_validate_exaggerate, contrast_beats]
            - variable: scenes_list
              value_selector: [assemble_bundle, scenes_list]
          template: |
            # Step2 输出：人设 × 夸张反差 × 场景

            **帽度（hat_level）**: {{ hat_level }}
            **市场（market）**: {{ market if market else "未指定（按保守默认处理）" }}
            {% if warnings_a or warnings_b %}
            **降级 / 披露记录**：
            {% for w in warnings_a + warnings_b %}
            - {{ w }}
            {% endfor %}
            {% endif %}

            ## 人物 personas
            {% for p in personas_list %}
            ### {{ p.persona_id }} · {{ p.identity_label }}
            - 权威依据：{{ p.authority_basis }}（原文锚点："{{ p.authority_evidence_quote }}"）
            - 受众定位：{{ p.audience_fit }}（原文锚点："{{ p.audience_pain_quote }}"）
            - 语气：{{ p.delivery_style }} / 镜头关系：{{ p.relationship_to_camera }}
            - 方法论引用：
            {% for g in p.grounded_in %}
              - {{ g.pattern_name }}：{{ g.rationale }}
            {% endfor %}

            {% endfor %}
            ## 夸张点 exaggeration_beats
            {% for b in exaggeration_beats %}
            ### {{ b.beat_id }} · {{ b.label_cn }} （{{ b.technique }} / {{ b.intensity }}，来自 {{ b.persona_ref }}）
            > {{ b.script_span_quote }}

            理由：{{ b.rationale }}

            {% endfor %}
            ## 反差点 contrast_beats
            {% for c in contrast_beats %}
            ### {{ c.beat_id }} · {{ c.label_cn }} （{{ c.contrast_type }}，来自 {{ c.persona_ref }}）
            - A 端：{{ c.anchor_quote_a }}
            - B 端：{{ c.anchor_quote_b }}

            理由：{{ c.rationale }}

            {% endfor %}
            ## 场景 scenes
            {% for s in scenes_list %}
            ### {{ s.scene_id }} · {{ s.scene_name }} （{{ s.camera_position }}，人物 {{ s.persona_ref }}，反差 {{ s.contrast_refs | join(', ') }}）
            - 触发时刻：{{ s.trigger_moment }}
            - 地点：{{ s.location }} / 微观坐标：{{ s.micro_coordinate }}
            - 道具：{{ s.visual_props | join(', ') }}
            - 氛围：{{ s.atmosphere }}
            - 理由：{{ s.rationale }}

            {% endfor %}

      # ---------------------------------------------------------------
