app:
  name: "100x-tiktok Step2 · 人设×夸张反差×场景生成器"
  description: "TikTok/UGC 脚本原文输入，产出：grounded-creative 人物设定（检索2-3条真实人设方法论作为约束和引用依据，禁止模板填空，人物必须逐字引用真实检索到的方法论名并说明理由）→ 夸张手法+反差点（复用 100x-exaggerate 闭集技法/反差类型/市场帽度天花板）→ 场景设计（场景跟着人设走，state_before_after 反差强制≥2个前后场景，机位限定6选1闭集）。每一阶段生成后立即机器校验，未通过不进入下一阶段，失败输出逐条具体原因。"
  icon: "🎬"
  icon_type: emoji
  icon_background: "#DCEEFB"
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: "0.7.0"
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.11@REPLACE_WITH_REAL_HASH_AFTER_IMPORT
      version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    viewport: { x: 0, y: 0, zoom: 0.15 }
    nodes:
      # ---------------------------------------------------------------
      # 0. START
      # ---------------------------------------------------------------
      - id: start
        type: custom
        position: { x: 40, y: 300 }
        positionAbsolute: { x: 40, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 166
        data:
          title: "接收脚本 + 校准输入"
          type: start
          selected: false
          variables:
            - label: "脚本/文案原文 source_script（必填，不接视频文件）"
              variable: source_script
              type: paragraph
              required: true
              max_length: 50000
            - label: "帽度等级 hat_level（可选，缺失按三级降级处理，默认 grayhat）"
              variable: hat_level
              type: select
              required: false
              options: [blackhat, grayhat, whitehat]
            - label: "目标市场 market（可选，如 美区 / US / 西语区 / 通用）"
              variable: market
              type: text-input
              required: false
              max_length: 200

      # ---------------------------------------------------------------
      # 1. 帽度/市场三级降级 —— 逐字复用 100x-exaggerate.dify.yml 的 calibrate_ceiling
      # ---------------------------------------------------------------
      - id: calibrate_ceiling
        type: custom
        position: { x: 320, y: 300 }
        positionAbsolute: { x: 320, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "Phase 1 · hat_level/market 三级降级"
          type: code
          selected: false
          code_language: python3
          code: |
            def main(hat_level_in: str, market_in: str) -> dict:
                # 100x-exaggerate workflow.md Phase 1 "类别B（软性，三级降级）":
                #   1. 两者都提供 -> 直接用
                #   2. 只提供 hat_level，缺 market -> 不追问；market 按公理3的保守默认处理
                #   3. 两者都缺 -> hat_level 内联推断为 grayhat；market 同样按保守默认
                # "market 给了、hat_level 缺"是插值组合（原表未显式列出），处理方式与
                # 100x-exaggerate.dify.yml 的 calibrate_ceiling 完全一致，逐字复用其逻辑。
                valid_hats = {"blackhat", "grayhat", "whitehat"}
                warnings = []

                hat_level = (hat_level_in or "").strip().lower()
                market = (market_in or "").strip()

                if hat_level and hat_level not in valid_hats:
                    warnings.append(
                        f'hat_level "{hat_level_in}" 不在 blackhat/grayhat/whitehat 闭集内，'
                        f'已忽略并按未提供处理'
                    )
                    hat_level = ""

                if hat_level and market:
                    effective_hat_level = hat_level
                    effective_market = market
                elif hat_level and not market:
                    effective_hat_level = hat_level
                    effective_market = ""
                    warnings.append(
                        "market 未提供，emotion_reaction_hyperbole 已按保守默认收紧至 "
                        "moderate（axioms.md 公理3）"
                    )
                elif not hat_level and market:
                    effective_hat_level = "grayhat"
                    effective_market = market
                    warnings.append(
                        "hat_level 未提供，已按 grayhat 推断；market 按用户提供值使用"
                        "（三级降级表未显式列出这一组合，按公理3机制自然外推，详见 notes.md）"
                    )
                else:
                    effective_hat_level = "grayhat"
                    effective_market = ""
                    warnings.append(
                        "hat_level/market 均未提供，已按 grayhat + 保守市场默认推断"
                        "（workflow.md Phase 1 类别B降级规则）"
                    )

                return {
                    "effective_hat_level": effective_hat_level,
                    "effective_market": effective_market,
                    "warnings": warnings,
                }
          variables:
            - value_selector: [start, hat_level]
              variable: hat_level_in
            - value_selector: [start, market]
              variable: market_in
          outputs:
            effective_hat_level:
              type: string
            effective_market:
              type: string
            warnings:
              type: array[string]

      # ---------------------------------------------------------------
      # 2. 检索 2-3 条真实人设方法论（占位 dataset_id，需人工重连，见 notes.md）
      # ---------------------------------------------------------------
      - id: kb_retrieve_persona_patterns
        type: custom
        position: { x: 600, y: 300 }
        positionAbsolute: { x: 600, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 110
        data:
          title: "检索真实人设方法论（占位 dataset_id，需人工重连）"
          type: knowledge-retrieval
          selected: false
          dataset_ids:
            - "REPLACE_WITH_DATASET_ID"
          query_variable_selector: [start, source_script]
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 3
            reranking_enable: false
            score_threshold_enabled: false
            score_threshold: 0
          metadata_filtering_mode: disabled

      # ---------------------------------------------------------------
      # 3. Stage A · 人物设定生成 —— grounded-creative + citation（核心机制）
      # ---------------------------------------------------------------
      - id: llm_generate_persona
        type: custom
        position: { x: 880, y: 300 }
        positionAbsolute: { x: 880, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 98
        data:
          title: "Stage A · 生成人物设定（grounded-creative + 引用）"
          type: llm
          selected: false
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.5
          prompt_template:
            - id: "c1a2e300-0001-4000-9000-000000000001"
              role: system
              text: |
                你是这条 TikTok/UGC 广告脚本流水线的"人物设定生成器"（Step 2 第一阶段）。

                【核心机制——请完整理解后再生成，这是本次设计的关键，不是可以跳过的背景说明】
                下面 context 里是本次检索到的 2-3 条"人设方法论"，来自真实观察到的短视频人设
                手法库，每条都包含 PATTERN_NAME / 心理机制 / 适用条件 / 何时避免使用 / 合规
                风险。这些方法论的作用是【圈定和约束】你的创作，不是给你一段可以照抄填空的
                成品文案：
                - 正确做法：读懂某条方法论的心理机制和模式形状，判断它是否适合眼前这条脚本，
                  然后用这条脚本自己的产品细节、场景、语气，全新写一段【这条脚本专属】的人物
                  设定，让它真实地体现同一种心理机制。可以只用一条方法论，也可以对同一个人物
                  合理混合借鉴两条方法论并在 rationale 里说明为什么混合。
                - 错误做法（本次明确禁止）：把方法论"方法论模式"段落的文案原样抄进任何输出
                  字段、只把产品名换掉当作"生成"、或者忽略方法论直接凭空捏造人物。
                - 每个人物必须在 grounded_in 字段里明确引用你参考的 1 条或多条方法论，且
                  pattern_name 必须【逐字复制】自 context 里某条方法论开头
                  "PATTERN_NAME: xxx" 那一行的 xxx 部分——不能自己翻译、简化、意译或臆造一个
                  名字。下游会拿这个字符串去检索结果原文里做逐字匹配校验，编造或改写过的引用
                  会直接判失败（这是"引用必须真实存在于检索结果"的机械校验，不是走过场）。
                - 每条方法论都带有 AVOID_WHEN（什么情况下不该用这个模式）和 COMPLIANCE_RISKS
                  （合规风险提示）。你写的人物设定不应该撞进你自己引用的那条方法论明确警告过
                  的场景——如果你确实觉得某种程度的关键词重叠不可避免且有正当理由，就在
                  risk_self_check 字段里写清楚理由，不要留空指望没人发现，下游会重新扫描
                  一遍你引用的方法论的 AVOID_WHEN/COMPLIANCE_RISKS 文本和你写的人物字段之间
                  是否有可疑的字面重叠。

                【复用自 100x-persona 的既有规则，原样保留，不因为本次改机制就放松】
                - authority_evidence_quote 和 audience_pain_quote 必须是用户提供的
                  source_script 里逐字出现的一段话——大小写不敏感子串匹配，但不许改写、不许
                  概括、不许翻译、不许替换同义词。下游会用 quote in source_script 做逐字
                  校验，任何复述都会判失败。
                - authority_basis 不要求正式资质，"产后亲身经历"这类同理型信任一样合法，但
                  引文本身必须真实存在于原文。
                - relationship_to_camera 只能是这 5 个闭集枚举值之一：direct-to-camera /
                  confessional / testimonial-witness / voice-over / duo-dialogue。
                - 【自我怀疑短语自检】如果你选的 authority_evidence_quote 命中下面这个闭集
                  短语表（不区分大小写子串匹配），必须把 hedge_self_flagged 设为 true 并在
                  hedge_note 说明为什么仍选它，否则下游直接判失败：
                  英文：if you don't believe me / you don't have to believe me / don't take
                  my word for it / i'm not sure / i am not sure / i don't know if / maybe
                  i'm wrong / i could be wrong / who knows / not 100% sure / i doubt
                  中文：如果你不信我 / 你可以不信 / 不管你信不信 / 信不信由你 / 我不确定 /
                  我也不知道 / 也许我 / 谁知道呢 / 说实话我也没底

                【产出规模】
                按脚本里实际能反推出的说话人数量产出 1 到 N 个人物，不强行凑数量，也不要
                漏掉脚本里明显存在的第二个说话人（如第三方见证混剪型脚本）。

                严格只输出下面这个 JSON 对象，不要 Markdown 代码围栏，不要任何解释文字：
                {
                  "personas": [
                    {
                      "identity_label": "...",
                      "authority_basis": "...",
                      "authority_evidence_quote": "...",
                      "audience_fit": "...",
                      "audience_pain_quote": "...",
                      "delivery_style": "...",
                      "relationship_to_camera": "direct-to-camera|confessional|testimonial-witness|voice-over|duo-dialogue",
                      "appearance_note": "...",
                      "grounded_in": [
                        {"pattern_name": "<逐字复制自 context 里的 PATTERN_NAME: 一行>", "rationale": "..."}
                      ],
                      "hedge_self_flagged": false,
                      "hedge_note": null,
                      "risk_self_check": null
                    }
                  ]
                }
            - id: "c1a2e300-0001-4000-9000-000000000002"
              role: user
              text: |
                参考方法论（本次检索到的 2-3 条真实人设模式，见下方 context；逐字引用请用
                它们各自的 PATTERN_NAME 行）：
                {{#context#}}

                脚本原文（source_script，所有引文必须能在这段原文里逐字找到）：
                {{#start.source_script#}}

                请按 system 提示中的规则，输出本条脚本的 personas JSON，只输出 JSON。
          context:
            enabled: true
            variable_selector: [kb_retrieve_persona_patterns, result]
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false

      # ---------------------------------------------------------------
      # 4. Stage A 校验 —— 引用真实性 + avoid_when/compliance_risks 启发式 + 证据子串 + 结构
      # ---------------------------------------------------------------
      - id: code_validate_persona
        type: custom
        position: { x: 1160, y: 300 }
        positionAbsolute: { x: 1160, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 90
        data:
          title: "校验人物：引用真实性+证据子串+结构"
          type: code
          selected: false
          code_language: python3
          code: |
            import json
            import re

            RELATIONSHIP_ENUM = {
                "direct-to-camera", "confessional", "testimonial-witness",
                "voice-over", "duo-dialogue",
            }
            REQUIRED_PERSONA_FIELDS = [
                "identity_label", "authority_basis", "authority_evidence_quote",
                "audience_fit", "audience_pain_quote", "delivery_style",
                "relationship_to_camera", "grounded_in",
            ]
            OPTIONAL_PERSONA_FIELDS = ["appearance_note", "hedge_self_flagged", "hedge_note", "risk_self_check"]
            ALLOWED_PERSONA_FIELDS = set(REQUIRED_PERSONA_FIELDS) | set(OPTIONAL_PERSONA_FIELDS)
            ALLOWED_GROUNDED_IN_FIELDS = {"pattern_name", "rationale"}

            # 逐字复用 100x-persona v1.2 checkAuthorityHedgeRisk 的闭集短语表。
            HEDGE_MARKERS = [
                "if you don't believe me", "you don't have to believe me",
                "don't take my word for it", "i'm not sure", "i am not sure",
                "i don't know if", "maybe i'm wrong", "i could be wrong", "who knows",
                "not 100% sure", "i doubt",
                "如果你不信我", "你可以不信", "不管你信不信", "信不信由你", "我不确定",
                "我也不知道", "也许我", "谁知道呢", "说实话我也没底",
            ]

            # 以下是本次集成新写的 compliance-heuristic 关键词切分规则，不是照搬任何源
            # skill——100x-persona/100x-exaggerate 都没有"引用的方法论 avoid_when 是否被
            # 违反"这条检查，因为独立版 100x-persona 根本不存在方法论检索这个机制。
            STOPWORDS = {
                "的", "和", "与", "或", "不", "是", "了", "在", "一个", "这个", "那个",
                "when", "with", "and", "the", "for", "that", "this",
            }
            TOKEN_SPLIT_RE = re.compile(r"[，。、,\.\s\(\)（）:：;；/]+")
            AVOID_WHEN_RE = re.compile(r"^AVOID_WHEN:\s*(.*)$", re.MULTILINE)
            COMPLIANCE_RISKS_RE = re.compile(r"^COMPLIANCE_RISKS:\s*(.*)$", re.MULTILINE)


            def _err(errors, tag, msg):
                errors.append(f"[{tag}] {msg}")


            def _tokenize_risk_phrase(phrase):
                tokens = [t.strip() for t in TOKEN_SPLIT_RE.split(phrase) if t.strip()]
                out = []
                for t in tokens:
                    if t.lower() in STOPWORDS:
                        continue
                    is_ascii = all(ord(c) < 128 for c in t)
                    if is_ascii and len(t) < 3:
                        continue
                    if not is_ascii and len(t) < 2:
                        continue
                    out.append(t)
                return out


            def _chunk_text(item):
                # Dify 1.16.0 api/core/workflow/nodes/knowledge_retrieval/retrieval.py 的
                # Source 模型字段（已对照官方源码逐字核对，非猜测）：metadata/title/files/
                # content/summary，content 是检索到的分段正文，title 是文档标题。这里做
                # 防御性兜底，字段缺失时退化到 metadata.document_name。
                if not isinstance(item, dict):
                    return str(item or "")
                title = item.get("title") or ""
                content = item.get("content") or ""
                if not title and not content:
                    meta = item.get("metadata")
                    if isinstance(meta, dict):
                        title = meta.get("document_name") or ""
                return f"{title}\n{content}"


            def main(source_script: str, retrieved_result: list, llm_raw: str) -> dict:
                source_script = source_script or ""
                errors = []
                warnings = []

                raw = (llm_raw or "").strip()
                if raw.startswith("```"):
                    raw = re.sub(r"^```[a-zA-Z]*\s*", "", raw)
                    raw = re.sub(r"```\s*$", "", raw)
                    raw = raw.strip()

                try:
                    parsed = json.loads(raw)
                    if not isinstance(parsed, dict):
                        raise ValueError("top-level JSON is not an object")
                except Exception as exc:
                    return {
                        "is_valid": "false",
                        "status": "failed",
                        "errors": [f"[parse] LLM output is not valid JSON: {exc}"],
                        "error_count": 1,
                        "personas": {},
                        "personas_list": [],
                        "warnings": warnings,
                    }

                persona_items = parsed.get("personas")
                if not isinstance(persona_items, list) or len(persona_items) == 0:
                    errors.append("[schema:personas] must be a non-empty array of persona objects")
                    persona_items = []

                retrieved_chunks = [_chunk_text(it) for it in (retrieved_result or [])]
                retrieved_chunks = [c for c in retrieved_chunks if c.strip()]
                if not retrieved_chunks:
                    _err(
                        errors, "retrieval",
                        "kb_retrieve_persona_patterns returned 0 candidates -- dataset_id may be "
                        "unconfigured or the KB seed docs have not been uploaded yet (see notes.md); "
                        "no citation can be verified as real until real candidates are retrieved",
                    )

                personas = {}
                personas_list = []
                for idx, item in enumerate(persona_items):
                    pid = f"PERSONA_{idx + 1}"
                    loc = f"personas[{idx}]({pid})"
                    if not isinstance(item, dict):
                        _err(errors, "schema", f"{loc} must be an object")
                        continue

                    extra = [k for k in item.keys() if k not in ALLOWED_PERSONA_FIELDS]
                    if extra:
                        _err(errors, "schema", f"{loc} has unexpected fields (additionalProperties:false): {extra}")

                    for field in REQUIRED_PERSONA_FIELDS:
                        if field == "grounded_in":
                            continue
                        value = item.get(field)
                        if not isinstance(value, str) or not value.strip():
                            _err(errors, "schema", f"{loc}.{field} is missing or not a non-empty string")

                    rel = item.get("relationship_to_camera")
                    if rel is not None and rel not in RELATIONSHIP_ENUM:
                        _err(errors, "schema", f"{loc}.relationship_to_camera '{rel}' is not one of {sorted(RELATIONSHIP_ENUM)}")

                    grounded_in = item.get("grounded_in")
                    if not isinstance(grounded_in, list) or len(grounded_in) == 0:
                        _err(errors, "citation", f"{loc}.grounded_in must be a non-empty array -- every persona must cite >=1 real retrieved pattern")
                        grounded_in = []

                    cited_pattern_texts = []
                    for gi_idx, gi in enumerate(grounded_in):
                        gi_loc = f"{loc}.grounded_in[{gi_idx}]"
                        if not isinstance(gi, dict):
                            _err(errors, "schema", f"{gi_loc} must be an object")
                            continue
                        gi_extra = [k for k in gi.keys() if k not in ALLOWED_GROUNDED_IN_FIELDS]
                        if gi_extra:
                            _err(errors, "schema", f"{gi_loc} has unexpected fields: {gi_extra}")
                        pname = gi.get("pattern_name")
                        rationale = gi.get("rationale")
                        if not isinstance(pname, str) or not pname.strip():
                            _err(errors, "schema", f"{gi_loc}.pattern_name is missing or not a non-empty string")
                            pname = None
                        if not isinstance(rationale, str) or not rationale.strip():
                            _err(errors, "schema", f"{gi_loc}.rationale is missing or not a non-empty string")
                        if pname:
                            matched_chunk = next((c for c in retrieved_chunks if pname in c), None)
                            if matched_chunk is None:
                                _err(
                                    errors, "citation",
                                    f'{gi_loc}.pattern_name "{pname}" was not found in any retrieved candidate '
                                    f'from kb_retrieve_persona_patterns -- citation is not real (either '
                                    f'hallucinated, or paraphrased instead of echoed verbatim from the '
                                    f'retrieved pattern name)',
                                )
                            else:
                                cited_pattern_texts.append((pname, matched_chunk))

                    aeq = item.get("authority_evidence_quote")
                    if isinstance(aeq, str) and aeq and aeq not in source_script:
                        _err(errors, "axiom2", f'{loc}.authority_evidence_quote is not a literal substring of source_script -> "{aeq}"')
                    apq = item.get("audience_pain_quote")
                    if isinstance(apq, str) and apq and apq not in source_script:
                        _err(errors, "axiom2", f'{loc}.audience_pain_quote is not a literal substring of source_script -> "{apq}"')

                    if isinstance(aeq, str):
                        lowered = aeq.lower()
                        hedge_hit = next((m for m in HEDGE_MARKERS if m.lower() in lowered), None)
                        if hedge_hit:
                            flagged = item.get("hedge_self_flagged") is True
                            note = item.get("hedge_note")
                            if not flagged or not isinstance(note, str) or not note.strip():
                                _err(
                                    errors, "axiom2-heuristic",
                                    f'{loc}.authority_evidence_quote contains a closed-list hedge/self-doubt '
                                    f'marker ("{hedge_hit}") with no matching hedge_self_flagged=true + '
                                    f'hedge_note disclosure. This heuristic cannot tell whether a semantic '
                                    f'reversal actually happened, only that this closed-list pattern is present. '
                                    f'Fix by re-selecting an anchor quote that is not itself a hedge, or setting '
                                    f'hedge_self_flagged=true with a hedge_note so a human reviews it.',
                                )
                            else:
                                warnings.append(f'{pid}: authority_evidence_quote hedge marker disclosed ({note})')

                    persona_text_concat = " ".join(
                        str(item.get(f) or "") for f in
                        ("identity_label", "authority_basis", "audience_fit", "delivery_style", "appearance_note")
                    ).lower()
                    risk_note = item.get("risk_self_check")
                    for pname, chunk in cited_pattern_texts:
                        avoid_m = AVOID_WHEN_RE.search(chunk)
                        comp_m = COMPLIANCE_RISKS_RE.search(chunk)
                        risk_phrases = []
                        if avoid_m:
                            risk_phrases.extend(p.strip() for p in avoid_m.group(1).split("|") if p.strip())
                        if comp_m:
                            risk_phrases.extend(p.strip() for p in comp_m.group(1).split("|") if p.strip())
                        matched_tokens = []
                        for phrase in risk_phrases:
                            for tok in _tokenize_risk_phrase(phrase):
                                if tok.lower() in persona_text_concat:
                                    matched_tokens.append((phrase, tok))
                        if matched_tokens:
                            disclosed = isinstance(risk_note, str) and risk_note.strip()
                            if not disclosed:
                                example_phrase, example_tok = matched_tokens[0]
                                _err(
                                    errors, "compliance-heuristic",
                                    f'{loc} cites pattern "{pname}" whose avoid_when/compliance_risks text '
                                    f'contains "{example_phrase}" (matched keyword "{example_tok}"), and this '
                                    f"persona's own fields contain that same keyword -- possible violation of "
                                    f'what it cites. This is a lexical/keyword heuristic, not semantic '
                                    f'understanding (see notes.md for its real limitations). Fix by setting a '
                                    f'non-empty risk_self_check explaining why this is not actually a violation, '
                                    f'or by changing the persona so it no longer overlaps.',
                                )
                            else:
                                warnings.append(f'{pid}: compliance-heuristic overlap with cited "{pname}" disclosed ({risk_note})')

                    out_item = {k: v for k, v in item.items() if k in ALLOWED_PERSONA_FIELDS}
                    personas[pid] = out_item
                    personas_list.append(dict(out_item, persona_id=pid))

                is_valid = len(errors) == 0
                return {
                    "is_valid": "true" if is_valid else "false",
                    "status": "passed" if is_valid else "failed",
                    "errors": errors,
                    "error_count": len(errors),
                    "personas": personas if is_valid else {},
                    "personas_list": personas_list if is_valid else [],
                    "warnings": warnings,
                }
          variables:
            - value_selector: [start, source_script]
              variable: source_script
            - value_selector: [kb_retrieve_persona_patterns, result]
              variable: retrieved_result
            - value_selector: [llm_generate_persona, text]
              variable: llm_raw
          outputs:
            is_valid:
              type: string
            status:
              type: string
            errors:
              type: array[string]
            error_count:
              type: number
            personas:
              type: object
            personas_list:
              type: array[object]
            warnings:
              type: array[string]

