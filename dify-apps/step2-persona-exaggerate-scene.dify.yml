      # ---------------------------------------------------------------
      # 9. Stage C · 场景生成 —— 场景跟着人设走 + 反差感知（state_before_after 强制2场景）
      # ---------------------------------------------------------------
      - id: llm_generate_scene
        type: custom
        position: { x: 2560, y: 300 }
        positionAbsolute: { x: 2560, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 98
        data:
          title: "Stage C · 生成场景（跟人设走+感知反差节拍）"
          type: llm
          selected: false
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.45
          prompt_template:
            - id: "c1a2e300-0003-4000-9000-000000000001"
              role: system
              text: |
                你是这条 TikTok/UGC 广告脚本流水线的"场景设计器"（Step 2 第三阶段，衔接
                人物设定与夸张/反差设计之后）。

                【核心原则一："场景跟着人设走"】
                每个 scene 必须绑定一个 persona_ref（引用下面 personas 里真实存在的一个
                key）——场景的视角、机位、道具都应该服务于"这是谁在拍"，不是脱离人物凭空
                设计一个场景。

                【核心原则二：场景要吸收夸张/反差节拍的信息】
                - 如果某条 contrast_beats 的 contrast_type 是 state_before_after（状态
                  前后反差），你必须为它设计至少 2 个不同的 scene，分别代表"前"和"后"
                  两种状态（不同的 trigger_moment / micro_coordinate / atmosphere，不能
                  用同一个场景描述硬凑两段），并且这 2 个（或更多）scene 都要在
                  contrast_refs 里引用这条 beat 的 beat_id——下游会机械核对这一点，只给
                  1 个场景会直接判失败。
                - 其余三种反差类型（tone_register / value_price / warning_vs_promotion）
                  没有场景数量下限，可以引用 0 条或多条 contrast_refs，按脚本实际情况
                  判断，不强求呼应。

                场景要基于脚本原文里真实存在的地点/动作/时间线索来设计，不要凭空编造脚本
                完全没有暗示过的场景。

                【复用自 100x-persona 的既有场景建模规则，原样保留】
                - trigger_moment：这个场景在人物一天/一生里的什么触发时刻发生，要具体
                  （如"下班回家换鞋前"），不能是"随时""某个时刻"这类空泛表达。
                - location：物理地点环境，同样要具体。
                - micro_coordinate：地点内的具体机位/具体动作坐标，必须比 location 更细
                  一级（例如"衣柜门把手"而不是重复"衣柜"），不能只是把 location 换个说法
                  重复一遍。
                - 【硬性红线，闭集泛化词表】trigger_moment / location / micro_coordinate
                  三个字段绝对不能出现下面任何一个词：某处、随便、某个地方、某场景、
                  某个场景、某个地点、某地、某时、待定、TBD、tbd、somewhere、Somewhere、
                  anywhere、Anywhere。命中任一词下游会直接判失败。
                - visual_props：至少 2 件画面里会出现的具体物件（通用品类词，不发明具体
                  品牌/产品名）。
                - atmosphere：一句话光线/情绪基调。

                【新增：camera_position 闭集机位枚举（6选1，替代自由文本描述）】
                - rear_camera_pov：手机后置固定/半固定机位，主力机位，用于产品展示、
                  功效特写
                - handheld_pov：第一人称手持视角，手部入镜做产品操作特写
                - handheld_selfie：手持前置自拍，用于口播、产品引入
                - gopro_pov：身体佩戴式运动视角，带自然抖动，用于场景转换、动作
                - mirror_selfie：对镜自拍，通常裁掉头部，用于穿搭/身材展示类场景
                - night_vision：夜视/低光机位，手机手电筒当唯一光源，用于氛围/高对比场景
                只能使用这 6 个英文枚举值之一，不许自创新值或用自由文本描述机位。

                产出规模：按人物和反差节拍的实际需要产出场景（state_before_after 至少
                2 个场景/条，其余场景数量按脚本实际场景线索决定，不强行凑数量）。

                严格只输出下面这个 JSON 对象，不要 Markdown 代码围栏，不要任何解释文字：
                {
                  "scenes": [
                    {
                      "scene_name": "...",
                      "trigger_moment": "...",
                      "location": "...",
                      "micro_coordinate": "...",
                      "visual_props": ["...", "..."],
                      "atmosphere": "...",
                      "camera_position": "rear_camera_pov|handheld_pov|handheld_selfie|gopro_pov|mirror_selfie|night_vision",
                      "persona_ref": "PERSONA_...",
                      "contrast_refs": ["CTR_..."],
                      "rationale": "..."
                    }
                  ]
                }
                contrast_refs 允许是空数组 []（这个场景不呼应任何特定反差点时），但字段
                本身必须存在。persona_ref 必须是下面提供的 personas 里真实存在的 key，
                contrast_refs 里的每个 id 必须是下面提供的 contrast_beats 里真实存在的
                beat_id，都不许杜撰。
            - id: "c1a2e300-0003-4000-9000-000000000002"
              role: user
              text: |
                脚本原文（source_script，场景线索需要能从这段原文里找到依据）：
                {{#start.source_script#}}

                已生成的人物设定（personas，JSON，persona_ref 必须引用这里真实存在的
                key）：
                {{#code_validate_persona.personas#}}

                已生成的夸张点（exaggeration_beats，仅供了解语气基调参考，不是引用
                对象）：
                {{#code_validate_exaggerate.exaggeration_beats#}}

                已生成的反差点（contrast_beats，JSON，contrast_refs 必须引用这里真实
                存在的 beat_id；特别注意 contrast_type 是 state_before_after 的条目
                需要至少 2 个场景覆盖）：
                {{#code_validate_exaggerate.contrast_beats#}}

                请按 system 提示中的规则，输出本条脚本的 scenes JSON，只输出 JSON。
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false

      # ---------------------------------------------------------------
      # 10. Stage C 校验 —— 复用 100x-persona 泛化词/道具数量，加机位闭集+引用完整性+零孤儿+2场景规则
      # ---------------------------------------------------------------
      - id: code_validate_scene
        type: custom
        position: { x: 2840, y: 300 }
        positionAbsolute: { x: 2840, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 90
        data:
          title: "校验场景：泛化词禁+机位+引用完整性+零孤儿"
          type: code
          selected: false
          code_language: python3
          code: |
            import json
            import re

            REQUIRED_SCENE_FIELDS = [
                "scene_name", "trigger_moment", "location", "micro_coordinate",
                "visual_props", "atmosphere", "camera_position", "persona_ref",
                "contrast_refs", "rationale",
            ]
            ALLOWED_SCENE_FIELDS = set(REQUIRED_SCENE_FIELDS)

            # 本次集成定义的闭集机位枚举，
            # 参考 UGC 六大机位分类规范
            # 的 6 机位分类结构（只借结构，不带具体占比数字）。
            CAMERA_POSITION_ENUM = {
                "rear_camera_pov", "handheld_pov", "handheld_selfie",
                "gopro_pov", "mirror_selfie", "night_vision",
            }

            # 逐字复用 100x-persona schema.json 的负向前瞻泛化词表（axiom 3）。
            VAGUE_WORDS = [
                "某处", "随便", "某个地方", "某场景", "某个场景", "某个地点", "某地", "某时",
                "待定", "TBD", "tbd", "somewhere", "Somewhere", "anywhere", "Anywhere",
            ]

            PERSONA_ID_RE = re.compile(r'^PERSONA_[A-Za-z0-9_]+$')
            CTR_ID_RE = re.compile(r'^CTR_[A-Za-z0-9_]+$')


            def _err(errors, tag, msg):
                errors.append(f"[{tag}] {msg}")


            def main(personas: dict, contrast_beats: list, llm_raw: str) -> dict:
                persona_id_set = set((personas or {}).keys())
                contrast_by_id = {b.get("beat_id"): b for b in (contrast_beats or []) if isinstance(b, dict)}

                raw = (llm_raw or "").strip()
                if raw.startswith("```"):
                    raw = re.sub(r"^```[a-zA-Z]*\s*", "", raw)
                    raw = re.sub(r"```\s*$", "", raw)
                    raw = raw.strip()

                try:
                    parsed = json.loads(raw)
                    if not isinstance(parsed, dict):
                        raise ValueError("top-level JSON is not an object")
                except Exception as exc:
                    return {
                        "is_valid": "false",
                        "status": "failed",
                        "errors": [f"[parse] LLM output is not valid JSON: {exc}"],
                        "error_count": 1,
                        "scenes": {},
                        "scenes_list": [],
                    }

                scene_items = parsed.get("scenes")
                if not isinstance(scene_items, list) or len(scene_items) == 0:
                    errors = ["[schema:scenes] must be a non-empty array of scene objects"]
                    scene_items = []
                else:
                    errors = []

                scenes = {}
                for idx, item in enumerate(scene_items):
                    sid = f"SCENE_{idx + 1}"
                    loc = f"scenes[{idx}]({sid})"
                    if not isinstance(item, dict):
                        _err(errors, "schema", f"{loc} must be an object")
                        continue

                    extra = [k for k in item.keys() if k not in ALLOWED_SCENE_FIELDS]
                    if extra:
                        _err(errors, "schema", f"{loc} has unexpected fields (additionalProperties:false): {extra}")
                    missing = [f for f in REQUIRED_SCENE_FIELDS if f not in item]
                    if missing:
                        _err(errors, "schema", f"{loc} missing required field(s): {missing}")

                    for field in ("trigger_moment", "location", "micro_coordinate"):
                        value = item.get(field)
                        if not isinstance(value, str) or len(value) < 3:
                            _err(errors, "axiom3-scene", f"{loc}.{field} missing or shorter than minLength:3")
                            continue
                        hit = next((w for w in VAGUE_WORDS if w in value), None)
                        if hit:
                            _err(errors, "axiom3-scene", f'{loc}.{field} contains a closed-list vague placeholder word "{hit}": "{value}"')

                    props = item.get("visual_props")
                    if not isinstance(props, list) or len(props) < 2 or not all(isinstance(p, str) and p.strip() for p in props):
                        _err(errors, "axiom3-scene", f"{loc}.visual_props must be an array of >=2 non-empty strings (minItems:2)")

                    for field in ("scene_name", "atmosphere", "rationale"):
                        value = item.get(field)
                        if not isinstance(value, str) or not value.strip():
                            _err(errors, "schema", f"{loc}.{field} is missing or not a non-empty string")

                    camera = item.get("camera_position")
                    if camera not in CAMERA_POSITION_ENUM:
                        _err(errors, "schema", f'{loc}.camera_position "{camera}" is not one of {sorted(CAMERA_POSITION_ENUM)}')

                    pref = item.get("persona_ref")
                    if not isinstance(pref, str) or not PERSONA_ID_RE.match(pref):
                        _err(errors, "schema", f'{loc}.persona_ref "{pref}" does not match ^PERSONA_[A-Za-z0-9_]+$')
                    elif pref not in persona_id_set:
                        _err(errors, "integration-ref", f'{loc}.persona_ref "{pref}" does not exist among this run\'s generated personas')

                    crefs = item.get("contrast_refs")
                    if not isinstance(crefs, list):
                        _err(errors, "schema", f"{loc}.contrast_refs must be an array (can be empty)")
                        crefs = []
                    for cref in crefs:
                        if not isinstance(cref, str) or not CTR_ID_RE.match(cref):
                            _err(errors, "schema", f'{loc}.contrast_refs contains "{cref}" which does not match ^CTR_[A-Za-z0-9_]+$')
                        elif cref not in contrast_by_id:
                            _err(errors, "integration-ref", f'{loc}.contrast_refs references "{cref}" which does not exist among this run\'s generated contrast_beats')

                    out_item = {k: v for k, v in item.items() if k in ALLOWED_SCENE_FIELDS}
                    scenes[sid] = out_item

                if not errors:
                    used_personas = {s.get("persona_ref") for s in scenes.values()}
                    for pid in persona_id_set:
                        if pid not in used_personas:
                            _err(errors, "axiom4-zero-orphan", f"{pid} is defined but never referenced by any scene's persona_ref (orphan)")

                    scenes_per_contrast = {}
                    for sid, s in scenes.items():
                        for cref in (s.get("contrast_refs") or []):
                            scenes_per_contrast.setdefault(cref, []).append(sid)

                    for beat_id, beat in contrast_by_id.items():
                        if beat.get("contrast_type") == "state_before_after":
                            covering = scenes_per_contrast.get(beat_id, [])
                            if len(covering) < 2:
                                _err(
                                    errors, "integration-before-after",
                                    f'contrast_beats "{beat_id}" has contrast_type=state_before_after, which '
                                    f'requires >=2 distinct scenes referencing it in contrast_refs (one '
                                    f'"before" setting, one "after" setting) -- only {len(covering)} scene(s) '
                                    f'reference it: {covering}. This is a new rule invented for this '
                                    f"integration (not present in 100x-persona or 100x-exaggerate "
                                    f'individually), following the "scene follows persona + contrast '
                                    f'beats" requirement.',
                                )

                scenes_list = [dict(v, scene_id=k) for k, v in scenes.items()]
                is_valid = len(errors) == 0
                return {
                    "is_valid": "true" if is_valid else "false",
                    "status": "passed" if is_valid else "failed",
                    "errors": errors,
                    "error_count": len(errors),
                    "scenes": scenes if is_valid else {},
                    "scenes_list": scenes_list if is_valid else [],
                }
          variables:
            - value_selector: [code_validate_persona, personas]
              variable: personas
            - value_selector: [code_validate_exaggerate, contrast_beats]
              variable: contrast_beats
            - value_selector: [llm_generate_scene, text]
              variable: llm_raw
          outputs:
            is_valid:
              type: string
            status:
              type: string
            errors:
              type: array[string]
            error_count:
              type: number
            scenes:
              type: object
            scenes_list:
              type: array[object]

      # ---------------------------------------------------------------
      # 11. 场景是否通过校验
      # ---------------------------------------------------------------
      - id: if_scene_valid
        type: custom
        position: { x: 3120, y: 300 }
        positionAbsolute: { x: 3120, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 126
        data:
          title: "场景是否通过校验"
          type: if-else
          selected: false
          cases:
            - id: "true"
              case_id: "true"
              logical_operator: and
              conditions:
                - id: "cond-scene-valid-0001"
                  variable_selector: [code_validate_scene, is_valid]
                  comparison_operator: is
                  value: "true"
                  varType: string
          conditions:
            - id: "cond-scene-valid-0001"
              variable_selector: [code_validate_scene, is_valid]
              comparison_operator: is
              value: "true"
              varType: string
          logical_operator: and

      # ---------------------------------------------------------------
      # 11f. 失败分支：场景阶段
      # ---------------------------------------------------------------
      - id: tpl_fail_scene
        type: custom
        position: { x: 3400, y: 560 }
        positionAbsolute: { x: 3400, y: 560 }
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
        data:
          title: "拼装：场景阶段失败报告"
          type: template-transform
          selected: false
          variables:
            - variable: errors
              value_selector: [code_validate_scene, errors]
            - variable: error_count
              value_selector: [code_validate_scene, error_count]
          template: |
            # Stage C（场景）校验未通过（{{ error_count }} 项）

            {% for e in errors %}
            - {{ e }}
            {% endfor %}

            常见修复方式：
            - [axiom3-scene] 泛化词/道具数量问题：trigger_moment/location/micro_coordinate
              不许出现闭集泛化词，visual_props 至少2件
            - [schema] camera_position 不在 6 选 1 闭集内，或字段缺失/多余
            - [integration-ref] persona_ref / contrast_refs 引用了不存在的 id
            - [axiom4-zero-orphan] 存在从未被任何场景 persona_ref 引用的人物
            - [integration-before-after] 某条 state_before_after 反差点只有 <2 个场景
              覆盖，需要补一个"前"或"后"的对应场景

