      # ---------------------------------------------------------------
      # 6. Stage B · 夸张/反差生成 —— 复用 100x-exaggerate 闭集技法+反差类型，加 persona_ref
      # ---------------------------------------------------------------
      - id: llm_generate_exaggerate
        type: custom
        position: { x: 1720, y: 300 }
        positionAbsolute: { x: 1720, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 98
        data:
          title: "Stage B · 生成夸张点+反差点（挂 persona_ref）"
          type: llm
          selected: false
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.4
          prompt_template:
            - id: "c1a2e300-0002-4000-9000-000000000001"
              role: system
              text: |
                你是 100x-exaggerate：TikTok/UGC 脚本的"夸张手法 + 反差点"设计器，现在作为
                Step2 流水线的第二阶段运行，衔接已经生成好的人物设定之后。

                输入：一段脚本/文案原文（source_script）+ 已确定的 hat_level
                （blackhat/grayhat/whitehat）+ market（可能是空字符串，表示未指定，需按
                保守默认处理）+ 已生成的 personas（JSON，key 是 PERSONA_ 开头的 id）。这些
                输入已经过 Phase 1 三级降级/Stage A 校验处理，直接使用，不要自己再猜测或
                改写。

                任务：
                1. 找出脚本里可以标注"夸张技法"的断言/宣称句，为每一条选择最贴近的技法，
                   不强行凑满5种都出现。
                2. 找出脚本里可以配对"反差"的两处真实不同表述，为每一条选择最贴近的反差
                   类型，不强行凑满4种都出现。
                3. 每条都必须给出逐字摘录（不改写、不概括、不翻译），因为下游会做逐字
                   子串校验——摘录必须一字不差地作为 source_script 的子串出现，大小写
                   敏感。
                4. intensity 是天花板内的选择，不是"能拉多高就拉多高"——一条语气克制的
                   原文即使天花板允许 aggressive，也可以标 moderate，忠于原文语气优先于
                   用满配额。
                5. 【本次集成新增】每条 beat（无论是夸张点还是反差点）都必须设置
                   persona_ref，引用 personas 里真实存在的一个 key——表示这条 beat 理解为
                   由哪个人物在说/在场景中呈现。如果只有一个人物，全部 beat 都引用它；如果
                   有多个人物，按脚本里实际是谁在说这句话来分配，不要随便乱指。

                夸张技法闭集枚举（5选1，只能使用下面这5个英文值，不许自创新词）：
                - numeric_hyperbole（数字夸张）：用具体夸张数字/金额/件数制造效果感知
                - time_compression_hyperbole（时间压缩夸张）：把效果压缩进不合常理的
                  短周期宣称
                - analogy_scale_hyperbole（类比放大夸张）：用具象事物类比放大/缩小效果
                - emotion_reaction_hyperbole（情绪反应夸张）：演员/旁观者的夸张情绪反应
                - authority_absolutism_hyperbole（权威绝对化夸张）：借权威/专家/数据做
                  近乎无条件的效果断言——只标注脚本里已经存在的宣称，不替脚本编造新的
                  机构名/认证/头衔

                反差类型闭集枚举（4选1，只能使用下面这4个英文值，不许自创新词）：
                - state_before_after（状态前后反差）：使用前/后两种状态的落差
                - tone_register（基调反差）：叙事基调的骤然转换（例如怀疑转笃定、
                  悬疑恐怖转日常促销）
                - value_price（价值反差）：参照物/原价与实际价格·价值的落差
                - warning_vs_promotion（警示反差）：表面警告语气与实际促购意图的反差

                强度天花板（intensity 三档，mild < moderate < aggressive）：
                - 基线按 hat_level：whitehat=mild，grayhat=moderate，blackhat=aggressive
                - 额外规则（只对 emotion_reaction_hyperbole 这一个技法生效，其余4个技法
                  不受此约束）：如果 market 命中"美区/美国/US/USA/United States/America"
                  这类别名（market 为空字符串时按保守默认视为命中），
                  emotion_reaction_hyperbole 的天花板收紧到 moderate，即使 hat_level 是
                  blackhat（基线 aggressive）也不例外。
                - 你给出的 intensity 只是建议值，下游会用同一套规则重新计算天花板并硬性
                  拒绝超限的产出，请按此规则自我约束，避免整份产出因一条 beat 超限被打回。

                反差两端要求：anchor_quote_a 与 anchor_quote_b 必须来自脚本里真实不同的
                两处表述，不能把同一句话抄两遍或稍微改写几个字充数——两端要有真实可感知
                的落差。

                禁用：
                - 不编造脚本原文没有的效果/数字/权威背书/认证/见证
                - 不为了凑数量堆砌 beats，也不强行让5种技法/4种反差类型都出现
                - 不使用"让我/希望/或许/大概/可能/也许/让我们"这类弱化表达，不使用AI
                  客服腔调（如 as an AI / I'd be happy to / feel free to）

                若脚本中确实找不到多条可用的夸张/反差落点（例如接近纯参数罗列），仍然
                只输出你能找到的最贴近项，不要编造；exaggeration_beats 和 contrast_beats
                下游各要求至少1条，无法留空数组。

                输出格式：只输出一个 JSON 对象，不要 Markdown 代码围栏、不要任何解释
                文字，不要在 JSON 前后添加任何其他内容。格式：
                {
                  "exaggeration_beats": [
                    {
                      "beat_id": "EXG_01",
                      "script_span_quote": "<脚本原文逐字摘录>",
                      "technique": "<5选1枚举值>",
                      "label_cn": "<中文短标签，2-6字最佳，硬性上限10字>",
                      "intensity": "<mild|moderate|aggressive>",
                      "rationale": "<一句话说明技法+强度选择理由，中文>",
                      "persona_ref": "PERSONA_..."
                    }
                  ],
                  "contrast_beats": [
                    {
                      "beat_id": "CTR_01",
                      "contrast_type": "<4选1枚举值>",
                      "label_cn": "<中文短标签，2-6字最佳，硬性上限10字>",
                      "anchor_quote_a": "<脚本原文逐字摘录A>",
                      "anchor_quote_b": "<脚本原文逐字摘录B，必须与A不同>",
                      "rationale": "<一句话说明反差理由，中文>",
                      "persona_ref": "PERSONA_..."
                    }
                  ]
                }
                beat_id 格式分别为 EXG_数字 / CTR_数字（如 EXG_01, EXG_02, CTR_01）。
                label_cn 长度必须在 1-10 个字符之间。exaggeration_beats 和
                contrast_beats 都至少输出1条。persona_ref 必须是下面提供的 personas 里
                真实存在的 key，不许杜撰。
            - id: "c1a2e300-0002-4000-9000-000000000002"
              role: user
              text: |
                脚本原文（source_script）：
                {{#start.source_script#}}

                已确定的校准输入（Phase 1 已完成三级降级，直接使用，不要自行改变）：
                - hat_level: {{#calibrate_ceiling.effective_hat_level#}}
                - market: {{#calibrate_ceiling.effective_market#}}

                已生成的人物设定（personas，JSON，persona_ref 必须引用这里真实存在的 key）：
                {{#code_validate_persona.personas#}}

                请按 system 提示中的规则，输出本条脚本的 exaggeration_beats +
                contrast_beats JSON，只输出 JSON。
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: ""
            role_prefix:
              assistant: ""
              user: ""
            window:
              enabled: false
              size: 50
          vision:
            enabled: false

      # ---------------------------------------------------------------
      # 7. Stage B 校验 —— 逐字复用 100x-exaggerate 的公理2/3/4 + 结构，加 persona_ref 引用完整性
      # ---------------------------------------------------------------
      - id: code_validate_exaggerate
        type: custom
        position: { x: 2000, y: 300 }
        positionAbsolute: { x: 2000, y: 300 }
        sourcePosition: right
        targetPosition: left
        width: 260
        height: 90
        data:
          title: "校验夸张反差：公理2/3/4+persona_ref引用完整性"
          type: code
          selected: false
          code_language: python3
          code: |
            import json
            import re


            def main(source_script: str, hat_level: str, market: str, personas: dict, llm_raw: str) -> dict:
                # 结构层 + 公理2(逐字子串)/公理3(市场帽度天花板，含v1.1精确分段匹配修正与
                # v1.2 "-"/"&" 分隔符修正)/公理4(反差非退化) 逐字复用
                # 100x-exaggerate.dify.yml 的 validate_bundle 节点逻辑，未新增未削弱任何一条
                # 判据。新增的唯一一条是 [integration-ref]：persona_ref 必须引用本次流水线
                # 里真实生成的 persona -- 这是本次集成新写的规则，100x-exaggerate 独立版
                # schema.json 完全不含 persona_ref 字段（见 notes.md）。
                hat_level = hat_level or ""
                market = market or ""
                persona_id_set = set((personas or {}).keys())

                raw = (llm_raw or "").strip()
                if raw.startswith("```"):
                    raw = re.sub(r"^```[a-zA-Z]*\s*", "", raw)
                    raw = re.sub(r"```\s*$", "", raw)
                    raw = raw.strip()

                try:
                    parsed = json.loads(raw)
                    if not isinstance(parsed, dict):
                        raise ValueError("top-level JSON is not an object")
                except Exception as exc:
                    return {
                        "is_valid": "false",
                        "status": "failed",
                        "errors": [f"[parse] LLM output is not valid JSON: {exc}"],
                        "error_count": 1,
                        "exaggeration_beats": [],
                        "contrast_beats": [],
                    }

                exaggeration_beats = parsed.get("exaggeration_beats")
                if not isinstance(exaggeration_beats, list):
                    exaggeration_beats = []
                contrast_beats = parsed.get("contrast_beats")
                if not isinstance(contrast_beats, list):
                    contrast_beats = []

                errors = []

                EXG_TECHNIQUES = {
                    "numeric_hyperbole", "time_compression_hyperbole", "analogy_scale_hyperbole",
                    "emotion_reaction_hyperbole", "authority_absolutism_hyperbole",
                }
                CTR_TYPES = {"state_before_after", "tone_register", "value_price", "warning_vs_promotion"}
                INTENSITIES = {"mild", "moderate", "aggressive"}
                HAT_LEVELS = {"blackhat", "grayhat", "whitehat"}
                EXG_ID_RE = re.compile(r"^EXG_[A-Za-z0-9_]+$")
                CTR_ID_RE = re.compile(r"^CTR_[A-Za-z0-9_]+$")
                PERSONA_ID_RE = re.compile(r'^PERSONA_[A-Za-z0-9_]+$')

                struct_errors = []

                if not isinstance(source_script, str) or len(source_script) < 1:
                    struct_errors.append("[schema:source_script] must be a non-empty string")
                if hat_level not in HAT_LEVELS:
                    struct_errors.append(f'[schema:meta.hat_level] "{hat_level}" is not one of {sorted(HAT_LEVELS)}')

                if len(exaggeration_beats) < 1:
                    struct_errors.append("[schema:exaggeration_beats] must be a non-empty array (minItems:1)")
                else:
                    exg_required = {"beat_id", "script_span_quote", "technique", "label_cn", "intensity", "rationale", "persona_ref"}
                    for idx, item in enumerate(exaggeration_beats):
                        loc = f"exaggeration_beats[{idx}]"
                        if not isinstance(item, dict):
                            struct_errors.append(f"[schema:{loc}] must be an object")
                            continue
                        missing = exg_required - set(item.keys())
                        if missing:
                            struct_errors.append(f"[schema:{loc}] missing required field(s): {sorted(missing)}")
                        extra = set(item.keys()) - exg_required
                        if extra:
                            struct_errors.append(f"[schema:{loc}] additionalProperties not allowed: {sorted(extra)}")
                        beat_id = item.get("beat_id")
                        if not isinstance(beat_id, str) or not EXG_ID_RE.match(beat_id):
                            struct_errors.append(f'[schema:{loc}.beat_id] "{beat_id}" does not match pattern ^EXG_[A-Za-z0-9_]+$')
                        quote = item.get("script_span_quote")
                        if not isinstance(quote, str) or len(quote) < 1:
                            struct_errors.append(f"[schema:{loc}.script_span_quote] must be a non-empty string")
                        technique = item.get("technique")
                        if technique not in EXG_TECHNIQUES:
                            struct_errors.append(f'[schema:{loc}.technique] "{technique}" is not one of {sorted(EXG_TECHNIQUES)}')
                        label_cn = item.get("label_cn")
                        if not isinstance(label_cn, str) or not (1 <= len(label_cn) <= 10):
                            struct_errors.append(f"[schema:{loc}.label_cn] must be a string of length 1-10")
                        intensity = item.get("intensity")
                        if intensity not in INTENSITIES:
                            struct_errors.append(f'[schema:{loc}.intensity] "{intensity}" is not one of {sorted(INTENSITIES)}')
                        rationale = item.get("rationale")
                        if not isinstance(rationale, str) or len(rationale) < 1:
                            struct_errors.append(f"[schema:{loc}.rationale] must be a non-empty string")
                        pref = item.get("persona_ref")
                        if not isinstance(pref, str) or not PERSONA_ID_RE.match(pref):
                            struct_errors.append(f'[schema:{loc}.persona_ref] "{pref}" does not match ^PERSONA_[A-Za-z0-9_]+$')

                if len(contrast_beats) < 1:
                    struct_errors.append("[schema:contrast_beats] must be a non-empty array (minItems:1)")
                else:
                    ctr_required = {"beat_id", "contrast_type", "label_cn", "anchor_quote_a", "anchor_quote_b", "rationale", "persona_ref"}
                    for idx, item in enumerate(contrast_beats):
                        loc = f"contrast_beats[{idx}]"
                        if not isinstance(item, dict):
                            struct_errors.append(f"[schema:{loc}] must be an object")
                            continue
                        missing = ctr_required - set(item.keys())
                        if missing:
                            struct_errors.append(f"[schema:{loc}] missing required field(s): {sorted(missing)}")
                        extra = set(item.keys()) - ctr_required
                        if extra:
                            struct_errors.append(f"[schema:{loc}] additionalProperties not allowed: {sorted(extra)}")
                        beat_id = item.get("beat_id")
                        if not isinstance(beat_id, str) or not CTR_ID_RE.match(beat_id):
                            struct_errors.append(f'[schema:{loc}.beat_id] "{beat_id}" does not match pattern ^CTR_[A-Za-z0-9_]+$')
                        contrast_type = item.get("contrast_type")
                        if contrast_type not in CTR_TYPES:
                            struct_errors.append(f'[schema:{loc}.contrast_type] "{contrast_type}" is not one of {sorted(CTR_TYPES)}')
                        label_cn = item.get("label_cn")
                        if not isinstance(label_cn, str) or not (1 <= len(label_cn) <= 10):
                            struct_errors.append(f"[schema:{loc}.label_cn] must be a string of length 1-10")
                        qa = item.get("anchor_quote_a")
                        if not isinstance(qa, str) or len(qa) < 1:
                            struct_errors.append(f"[schema:{loc}.anchor_quote_a] must be a non-empty string")
                        qb = item.get("anchor_quote_b")
                        if not isinstance(qb, str) or len(qb) < 1:
                            struct_errors.append(f"[schema:{loc}.anchor_quote_b] must be a non-empty string")
                        rationale = item.get("rationale")
                        if not isinstance(rationale, str) or len(rationale) < 1:
                            struct_errors.append(f"[schema:{loc}.rationale] must be a non-empty string")
                        pref = item.get("persona_ref")
                        if not isinstance(pref, str) or not PERSONA_ID_RE.match(pref):
                            struct_errors.append(f'[schema:{loc}.persona_ref] "{pref}" does not match ^PERSONA_[A-Za-z0-9_]+$')

                errors.extend(struct_errors)

                if not struct_errors:
                    script = source_script

                    for item in exaggeration_beats:
                        if item.get("script_span_quote") not in script:
                            errors.append(f"[axiom2] {item.get('beat_id')}: script_span_quote is not a literal substring of source_script")
                        pref = item.get("persona_ref")
                        if pref not in persona_id_set:
                            errors.append(f'[integration-ref] {item.get("beat_id")}: persona_ref "{pref}" does not exist among this run\'s generated personas')
                    for item in contrast_beats:
                        if item.get("anchor_quote_a") not in script:
                            errors.append(f"[axiom2] {item.get('beat_id')}: anchor_quote_a is not a literal substring of source_script")
                        if item.get("anchor_quote_b") not in script:
                            errors.append(f"[axiom2] {item.get('beat_id')}: anchor_quote_b is not a literal substring of source_script")
                        pref = item.get("persona_ref")
                        if pref not in persona_id_set:
                            errors.append(f'[integration-ref] {item.get("beat_id")}: persona_ref "{pref}" does not exist among this run\'s generated personas')

                    def normalize(s):
                        return re.sub(r"\s+", " ", (s or "").strip().lower())

                    for item in contrast_beats:
                        if normalize(item.get("anchor_quote_a")) == normalize(item.get("anchor_quote_b")):
                            errors.append(f"[axiom4] {item.get('beat_id')}: anchor_quote_a and anchor_quote_b are the same quote (normalized) -- no real contrast gap")

                    INTENSITY_RANK = {"mild": 1, "moderate": 2, "aggressive": 3}
                    BASE_CEILING_BY_HAT_LEVEL = {"whitehat": 1, "grayhat": 2, "blackhat": 3}
                    US_MARKET_ALIASES = {"美区", "美国", "us", "usa", "united states", "america"}
                    MARKET_SEGMENT_SPLIT_RE = re.compile(r"[,，、;；|&()（）/-]+")

                    def is_us_market(market_str):
                        raw_m = market_str or ""
                        segments = [seg.strip().lower() for seg in MARKET_SEGMENT_SPLIT_RE.split(raw_m) if seg.strip()]
                        return any(seg in US_MARKET_ALIASES for seg in segments)

                    def emotion_ceiling_for_market(market_str):
                        has_market = isinstance(market_str, str) and market_str.strip() != ""
                        if not has_market:
                            return INTENSITY_RANK["moderate"]
                        return INTENSITY_RANK["moderate"] if is_us_market(market_str) else INTENSITY_RANK["aggressive"]

                    base_ceiling = BASE_CEILING_BY_HAT_LEVEL.get(hat_level)
                    if base_ceiling:
                        for item in exaggeration_beats:
                            item_rank = INTENSITY_RANK.get(item.get("intensity"))
                            ceiling = base_ceiling
                            if item.get("technique") == "emotion_reaction_hyperbole":
                                ceiling = min(ceiling, emotion_ceiling_for_market(market))
                            if item_rank is not None and item_rank > ceiling:
                                ceiling_label = [k for k, v in INTENSITY_RANK.items() if v == ceiling][0]
                                market_note = (
                                    f' / market "{market}"'
                                    if market
                                    else " / market unspecified (conservative default applied)"
                                )
                                errors.append(
                                    f'[axiom3] {item.get("beat_id")}: intensity '
                                    f'"{item.get("intensity")}" exceeds calibration ceiling '
                                    f'"{ceiling_label}" for technique "{item.get("technique")}" '
                                    f'under hat_level "{hat_level}"{market_note}'
                                )

                is_valid = len(errors) == 0
                return {
                    "is_valid": "true" if is_valid else "false",
                    "status": "passed" if is_valid else "failed",
                    "errors": errors,
                    "error_count": len(errors),
                    "exaggeration_beats": exaggeration_beats if is_valid else [],
                    "contrast_beats": contrast_beats if is_valid else [],
                }
          variables:
            - value_selector: [start, source_script]
              variable: source_script
            - value_selector: [calibrate_ceiling, effective_hat_level]
              variable: hat_level
            - value_selector: [calibrate_ceiling, effective_market]
              variable: market
            - value_selector: [code_validate_persona, personas]
              variable: personas
            - value_selector: [llm_generate_exaggerate, text]
              variable: llm_raw
          outputs:
            is_valid:
              type: string
            status:
              type: string
            errors:
              type: array[string]
            error_count:
              type: number
            exaggeration_beats:
              type: array[object]
            contrast_beats:
              type: array[object]

