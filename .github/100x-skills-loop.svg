  <circle cx="814" cy="402" r="4" fill="#2B7FFF"/>
  <circle cx="632" cy="402" r="4" fill="#2B7FFF"/>
  <circle cx="450" cy="402" r="4" fill="#2B7FFF"/>
  <text x="730" y="424" fill="#777773" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle">new low-confidence atoms feed back to the private knowledge base</text>
</svg>
