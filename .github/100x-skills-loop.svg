<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">100x-skill-tiktok flow</title>
  <desc id="desc">Creative inputs converge into a governed skill framework (axioms, schema, validator), then expand into validated structured outputs, with new knowledge atoms feeding back.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B7FFF"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A2A29E"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#F4F4F2"/>
  <rect x="24" y="24" width="1152" height="412" rx="14" fill="#FFFFFF" stroke="#DEDEDB"/>

  <g fill="#666662" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
    <text x="80" y="82">INPUT</text>
    <text x="546" y="82">SKILL FRAMEWORK</text>
    <text x="1038" y="82">OUTPUT</text>
  </g>

  <g fill="#777773" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">
