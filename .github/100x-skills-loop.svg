    <path d="M148 196 C258 196 286 224 382 224"/>
    <path d="M148 260 C258 260 286 236 382 236"/>
  </g>

  <g>
    <circle cx="116" cy="132" r="9" fill="#FFFFFF" stroke="#171716" stroke-width="2"/>
    <circle cx="116" cy="196" r="9" fill="#FFFFFF" stroke="#171716" stroke-width="2"/>
    <circle cx="116" cy="260" r="9" fill="#FFFFFF" stroke="#171716" stroke-width="2"/>
    <circle cx="116" cy="132" r="3" fill="#2B7FFF"/>
    <circle cx="116" cy="196" r="3" fill="#2B7FFF"/>
    <circle cx="116" cy="260" r="3" fill="#2B7FFF"/>
  </g>

  <g fill="#FFFFFF" stroke="#A2A29E" stroke-width="1.5">
